function index(x,y){return y*VW+x}function inMap(x,y){return x>=0&&y>=0&&x<VW&&y<VH}
function makeMap(seed){const sd=hashStr(seed);terrain=[];features=[];fog=new Array(VW*VH).fill(false);const r=rng(sd);for(let y=0;y<VH;y++){for(let x=0;x<VW;x++){let elevation=.53*valueNoise(x,y,18,sd)+.31*valueNoise(x,y,8,sd+14)+.16*valueNoise(x,y,3,sd+71);let shore=elevation<.38?'water':elevation<.41?'sand':elevation>.69?'stone':'grass';let dist=Math.hypot(x-28,y-28);if(dist<6.5)shore='grass';let moisture=valueNoise(x,y,13,sd+44),variation=hash(x,y,sd),kind=shore;terrain.push({kind,variation,moisture,elevation});if(dist>8&&shore==='grass'&&moisture>.50&&variation>.59)features.push({x,y,type:'tree',id:'f'+x+'-'+y});else if(dist>8&&shore!=='water'&&variation<.062)features.push({x,y,type:shore==='stone'?'ore':'scrap',id:'f'+x+'-'+y});else if(dist>8&&shore==='grass'&&variation>.38&&variation<.40)features.push({x,y,type:'bush',id:'f'+x+'-'+y});}}

function validExpeditionSave(o){
 if(!o||typeof o!=='object'||Array.isArray(o)||![3,4].includes(o.v)||typeof o.seed!=='string'||o.seed.length<1||o.seed.length>100)return false;
 if(!Number.isFinite(o.day)||o.day<1||!Number.isFinite(o.minute)||o.minute<0||o.minute>=1440)return false;
 if(!o.resources||typeof o.resources!=='object'||!Array.isArray(o.colonists)||!Array.isArray(o.buildings)||!Array.isArray(o.fog))return false;
 if(o.v===4&&!FarwakeSaveMigration.validLife(o))return false;
 if(o.fog.length!==VW*VH||o.colonists.length<1||o.colonists.length>100||o.buildings.length>10000)return false;
 if(!o.colonists.every(p=>p&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&typeof p.name==='string'))return false;
 if(!o.buildings.every(b=>b&&Number.isFinite(b.x)&&Number.isFinite(b.y)&&typeof b.type==='string'&&Number.isFinite(b.w)&&Number.isFinite(b.h)))return false;
 return true;
}
function exportExpedition(){
 save();
 const raw=localStorage.getItem(SAVE);
 if(!raw){notice('No expedition save to export.');return;}
 try{
  const data=JSON.parse(raw);
  if(!validExpeditionSave(data))throw Error('Save data is invalid.');
  const backup={format:'farwake-expedition-backup',formatVersion:1,exportedAt:new Date().toISOString(),save:data};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='FARWAKE-'+String(data.seed||'expedition').replace(/[^a-z0-9_-]/gi,'_').slice(0,30)+'-day-'+data.day+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  notice('Expedition backup prepared. Save it in Files.');
 }catch(e){console.error('Export failed',e);notice('Could not export the expedition.');}
}
async function importExpeditionFile(file){
 if(!file)return;
 try{
  if(file.size>5*1024*1024)throw Error('Backup file is too large.');
  const loaded=JSON.parse(await file.text());
  const data=loaded?.format==='farwake-expedition-backup'?loaded.save:loaded;
  if(!validExpeditionSave(data))throw Error('This is not a compatible FARWAKE Founders save (versions 3–4).');
  const current=localStorage.getItem(SAVE);
  if(!confirm('Import '+data.seed+' (Day '+data.day+')? This replaces the colony stored at this web address. A local emergency backup will be kept.'))return;
  if(current)localStorage.setItem(SAVE+'_before_import_'+Date.now(),current);
  localStorage.setItem(SAVE,JSON.stringify(data));
  importedNavigation=true;location.reload();
 }catch(e){console.warn('Import failed',e);notice(e.message||'Could not import this file.');}
}

function housingPermanent(b){return b.type!=='camp'&&!FRONTIER_BUILDINGS[b.type]?.temporary}
// Bed allocation is persistent (p.home). Current occupancy is driven by a visit.
function housingBeds(b) {
  if(!b?.finished||b.editOrder)return 0;
  const base=b.type==='shelter'?3:b.type==='camp'?5:FRONTIER_BUILDINGS[b.type]?.beds||0;
  return base?base+(b.level>1?b.level-1:0):0;
}
function housingName(b){
  return b?(TYPES[b.type]?.name||'Expedition camp')+' · '+b.x+', '+b.y:'No bed assigned';
}
function housingResidents(b){return S.colonists.filter(p=>p.home===b.id);}
function housingAllocate(){
  const houses=S.buildings.filter(b=>housingBeds(b));
  const usage=new Map(houses.map(b=>[b.id,0]));
  // Keep existing valid assignments first. Preserve explicit temporary-bed choices too.
  for(const p of S.colonists){
    const b=houses.find(b=>b.id===p.home);
    if(!b||usage.get(b.id)>=housingBeds(b)){p.home=null;delete p.homePinned;}
    else usage.set(b.id,usage.get(b.id)+1);
  }
  for(const p of S.colonists){
    const old=houses.find(b=>b.id===p.home);
    if(old&&(housingPermanent(old)||p.homePinned))continue;
    const next=houses.find(b=>housingPermanent(b)&&usage.get(b.id)<housingBeds(b))
      ||old||houses.find(b=>usage.get(b.id)<housingBeds(b));
    if(next&&next!==old){
      if(old)usage.set(old.id,usage.get(old.id)-1);
      p.home=next.id;usage.set(next.id,usage.get(next.id)+1);
    }
  }
  for(const p of S.colonists){
    if(p.task?.type==='rest'&&(p.task.id??null)!==p.home){p.task=null;p.path=[];p.action=0;}
  }
}
function housingAssign(personId,buildingId,swapId){
  const p=S.colonists.find(p=>p.id===personId),next=S.buildings.find(b=>b.id===buildingId);
  if(!p||!housingBeds(next)||p.home===next.id)return false;
  const old=p.home, members=housingResidents(next);
  if(members.length>=housingBeds(next)){
    const swap=members.find(o=>o.id===swapId);
    if(!swap)return false;
    swap.home=old;swap.homePinned=!!old;
  }
  p.home=next.id;p.homePinned=true;
  housingAllocate();save();return true;
}
function housingRelease(b){
  for(const p of S.colonists){
    if(p.visit?.building===b.id){FarwakeDoors.restore(p,S.buildings,walkable);p.task=null;p.path=[];p.action=0;}
    if(p.home===b.id){p.home=null;delete p.homePinned;}
    if(p.task?.type==='rest'&&p.task?.id===b.id){p.task=null;p.path=[];p.action=0;}
  }
}
function housingRestTarget(p){

  return b?{type:'rest',id:b.id,x:b.x,y:b.y,w:b.w,h:b.h}:
    {type:'rest',outdoors:true,x:Math.floor(p.x),y:Math.floor(p.y)};
}
function housingRecovery(p,work){
  const b=p.visit?.stage==='inside'&&S.buildings.find(b=>b.id===p.visit.building&&b.id===p.home);
  const permanent=b&&housingPermanent(b), temporary=b&&!permanent;

  p.energy=clamp(p.energy+work*(permanent?5.8*(FRONTIER_BUILDINGS[b.type]?.comfort||1)*(1+.1*((b.level||1)-1)):temporary?4.5:2.1)*(clinic&&power().supply>=power().used?1.2+.1*((clinic.level||1)-1):1),0,100);
  p.mood=clamp(p.mood+work*(permanent?.035:temporary?0:-.055),0,100);

function housingCounts(){

// S.resources is the backward-compatible total. Per-store accounts hold that same
// inventory, not a second supply. Every transaction updates both in the same tick.
function freightFlow(k,n,key){
 S.freightFlow??={};if(S.freightFlow.day!==S.day)S.freightFlow={day:S.day};
 const series=S.freightFlow[key]??={};series[k]=(series[k]||0)+n;
}
function freightFlowTable(){
 const f=S.freightFlow?.day===S.day?S.freightFlow:{};
 return '<details><summary>Production &amp; consumption today</summary>'+Object.entries(MATERIALS).map(([k,m])=>'<div class="service"><span>'+m.name+'</span><strong>+'+(f.produced?.[k]||0)+' / −'+(f.consumed?.[k]||0)+'</strong></div>').join('')+'</details>';
}
function freightCap(b){return (b.type==='supplies'?340:FRONTIER_BUILDINGS[b.type]?.storage||180)+((b.level||1)-1)*90}
function freightUsed(b){return Object.values(b.stock||{}).reduce((a,v)=>a+v,0)}
function freightAccepts(b,k){return !b.reject?.includes(k)}
function freightRecorded(id){return S.colonists.reduce((n,p)=>n+(p.carry?.dest===id?p.carry.amount:0)+(p.task?.type==='haul_pickup'&&p.task.dest===id?p.task.amount:0),0)}
function freightFree(b){return Math.max(0,freightCap(b)-freightUsed(b)-freightRecorded(b.id))}
function freightOutside(kind,amount,origin,flags={}){
 if(!amount)return;
 const ox=clamp(Math.floor(origin.x),0,VW-1),oy=clamp(Math.floor(origin.y),0,VH-1);
 let tile=null;
 for(let r=0;r<VW+VH&&!tile;r++){
  for(let dy=-r;dy<=r&&!tile;dy++)for(let dx=-r;dx<=r;dx++){
   if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
   const x=ox+dx,y=oy+dy;
   if(!inMap(x,y)||!walkable(x,y)||buildingAt(x,y)||featureAt(x,y))continue;
   const pile=pileAt(x,y);
   if(pile){if(pile.kind===kind&&!!pile.hold===!!flags.hold&&pile.site===flags.site){pile.amount+=amount;return pile}continue}
   tile={x,y};break;
  }
 }
 const q={id:'lot-'+(uid++),...(tile||{x:ox,y:oy}),kind,amount,...flags};S.piles.push(q);return q;
}
function freightInit(){
 for(const b of S.buildings)if(b.editOrder&&b.stock)freightRemoveStore(b);
 const stores=storageBuildings();
 // A legacy save already paid for unfinished buildings when their blueprints were placed.
 for(const b of S.buildings)if(!b.finished&&!b.reservedMaterials){b.reservedMaterials={...TYPES[b.type]?.cost};b.siteStock={...b.reservedMaterials}}
 for(const b of stores)b.stock??={};
 for(const k of Object.keys(MATERIALS)){
  const total=S.resources[k]||0;
  let delta=total-stores.reduce((n,b)=>n+(b.stock[k]||0),0);
  for(const b of stores){
   const part=delta<0?-Math.min(-delta,b.stock[k]||0):Math.min(delta,Math.max(0,freightCap(b)-freightUsed(b)));
   b.stock[k]=(b.stock[k]||0)+part;delta-=part;
  }
  if(delta>0){freightOutside(k,delta,stores[0]||{x:28,y:28});S.resources[k]-=delta}
 }
}
function freightAvailable(k){return (S.resources[k]||0)+S.piles.reduce((n,p)=>n+(p.kind===k&&!p.hold&&p.site==null?p.amount:0),0)}
function freightDrain(k,qty,onTake){
 let left=qty;
 for(const b of storageBuildings()){
  const take=Math.min(left,b.stock?.[k]||0);
  if(take){b.stock[k]-=take;S.resources[k]-=take;left-=take;onTake?.(take,b)}
  if(!left)break;
 }
 return qty-left;
}
function freightSpend(cost){
 if(Object.entries(cost).some(([k,n])=>!MATERIALS[k]||!Number.isFinite(n)||n<0||(S.resources[k]||0)<n))return false;
 for(const [k,n] of Object.entries(cost)){freightDrain(k,n);freightFlow(k,n,'consumed')}
 return true;
}
function freightReserve(cost,b){
 if(Object.entries(cost).some(([k,n])=>!MATERIALS[k]||!Number.isFinite(n)||n<0||freightAvailable(k)<n))return false;
 b.reservedMaterials={...cost};b.siteStock={};
 for(const [k,qty] of Object.entries(cost)){
  let left=qty-freightDrain(k,qty,(n,store)=>freightOutside(k,n,store,{site:b.id}));
  for(const q of S.piles.slice()){
   if(!left)break;
   if(q.kind!==k||q.site!=null||q.hold)continue;
   const n=Math.min(left,q.amount);
   if(n===q.amount){q.site=b.id;}else{q.amount-=n;freightOutside(k,n,q,{site:b.id})}
   left-=n;
   for(const p of S.colonists)if(p.task?.type==='haul_pickup'&&p.task.pileId===q.id){p.task=null;p.path=[]}
  }
 }
 return true;
}
function freightSiteReady(b){return Object.entries(b.reservedMaterials||{}).every(([k,v])=>(b.siteStock?.[k]||0)>=v)}
function freightRefund(cost,b){for(const [k,n] of Object.entries(cost))if(n>0)freightOutside(k,n,b)}
function freightCancel(b,fraction=1){
 for(const pile of S.piles)if(pile.site===b.id)delete pile.site;
 for(const p of S.colonists){
  if(p.carry?.site===b.id){delete p.carry.site;delete p.carry.dest;p.task=null;p.path=[]}
 }
 freightRefund(Object.fromEntries(Object.entries(b.siteStock||{}).map(([k,v])=>[k,Math.floor(v*fraction)])),b);
 b.reservedMaterials={};b.siteStock={};
}
function freightRemoveStore(b){

}
function freightOutput(k,n,b){freightFlow(k,n,'produced');return freightOutside(k,n,b)}
function freightSite(id){return S.buildings.find(b=>(!b.finished||b.inputOrder||b.upgradeOrder)&&b.id===id)}
function freightCandidateStores(p,k){return storageBuildings().filter(b=>freightAccepts(b,k)).sort((a,b)=>(b.priority||0)-(a.priority||0)||Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))}
function freightClaim(p,q){
 if(!q||q.hold||S.colonists.some(z=>z!==p&&z.task?.type==='haul_pickup'&&z.task.pileId===q.id))return false;
 const site=freightSite(q.site);
 if(site&&!frontierMarkAccess(site))return false;
 const dest=site||freightCandidateStores(p,q.kind).find(b=>freightFree(b)>0);
 if(!dest)return false;
 const amount=Math.min(12,q.amount,site?Infinity:freightFree(dest));

}
function freightPlan(p){
 if(p.carry){
  const c=p.carry,site=freightSite(c.site);
  if(site&&!frontierMarkAccess(site)){
   freightOutside(c.kind,c.amount,p,{site:site.id});
   p.carry=null;p.task=null;p.path=[];return null;
  }
  for(const b of site?[site]:freightCandidateStores(p,c.kind)){
   const room=freightFree(b)+(c.dest===b.id?c.amount:0);
   if(!site&&room<c.amount)continue;
   const t={type:'haul_dropoff',id:b.id,x:b.x,y:b.y,w:b.w,h:b.h};
   if(setTask(p,t)){c.dest=b.id;return p.task}
  }
  // A failed site drop stays reserved. Do not hand the same load straight back to this hauler.
  if(site){p.task=null;p.path=[];return null}
  freightOutside(c.kind,c.amount,p,{});
  p.carry=null;p.task=null;p.path=[];return null;
 }
 if(!['auto','gather','build','haul'].includes(p.work))return null;
 const urgent=S.freightUrgent||'';
 const rank=q=>q.site!=null?3:q.kind===urgent?2:1;
 const ordered=S.piles.filter(q=>!q.hold).sort((a,b)=>rank(b)-rank(a)||Math.hypot(p.x-a.x,p.y-a.y)-Math.hypot(p.x-b.x,p.y-b.y));
 for(const q of ordered){
  const site=q.site!=null&&freightSite(q.site);
  if(site&&!frontierMarkAccess(site))continue;
  if(freightClaim(p,q))return p.task;
 }

}
function freightPickup(p,t){
 const q=pileById(t.pileId);if(!q||q.hold){p.task=null;return}
 const n=Math.min(q.amount,t.amount||12);
 p.carry={kind:q.kind,amount:n,dest:t.dest,site:q.site};
 q.amount-=n;if(!q.amount)S.piles=S.piles.filter(l=>l!==q);
 FarwakeWorkFX.transfer('pickup',p,p.carry);localSound('pickup',p);
 p.task=null;p.path=[];p.action=0;freightPlan(p);save();
}
function freightDeliver(p,t){
 const c=p.carry;if(!c){p.task=null;return}
 const site=freightSite(c.site),dst=S.buildings.find(b=>b.id===t.id);
 if(site&&site===dst){site.siteStock??={};site.siteStock[c.kind]=(site.siteStock[c.kind]||0)+c.amount}
 else if(!site&&dst?.finished&&storageBuildings().includes(dst)&&freightAccepts(dst,c.kind)&&freightCap(dst)-freightUsed(dst)>=c.amount){
  dst.stock??={};dst.stock[c.kind]=(dst.stock[c.kind]||0)+c.amount;S.resources[c.kind]=(S.resources[c.kind]||0)+c.amount;
 }else{p.task=null;p.path=[];freightPlan(p);return}
 FarwakeWorkFX.transfer('delivery',p,c);localSound('drop',p);
 log('',p.name+' delivered '+c.amount+' '+MATERIALS[c.kind].name.toLowerCase()+(site?(site.finished?' to production.':' to construction.'):' to storage.'));
 p.carry=null;p.task=null;p.path=[];p.action=0;save();
}
function freightStatus(){
 const waiting=S.piles.filter(q=>q.site==null&&!q.hold);
 const blocked=waiting.find(q=>!storageBuildings().some(b=>freightAccepts(b,q.kind)&&freightFree(b)>0));
 if(blocked)return MATERIALS[blocked.kind].name+' waits outdoors: no accepting store has space. Enable a filter, move stock out or build a shed.';
 const crates=S.piles.filter(q=>q.site!=null).length;
 if(crates)return crates+' construction lot'+(crates===1?'':'s')+' awaiting delivery before building can begin.';
 if(waiting.length)return waiting.length+' outdoor lot'+(waiting.length===1?'':'s')+' available for hauling.';

}
function freightStorePanel(b){

function freightRulesHTML(){

function freightControl(e){

// Settlement editor state is a local preview; only confirmed orders are saved.
let editor = null;
const EDIT_NAMES = {path:'Lay stone path', road:'Lay constructed road', remove:'Remove paths', mark:'Mark field work', clear:'Cancel field orders', move:'Relocate structure'};
function editorButton(action,label,id='',primary=false) {
  return '<button type="button" class="'+(primary?'primary':'secondary')+'" data-editor="'+action+'" data-building="'+id+'">'+label+'</button>';
}
function editorToolbar() {
  return '<div class="sectioncap">Map tools</div><div class="buttongroup">'+
    ['path',...(S.research.includes('civilworks')?['road']:[]),'remove','mark','clear'].map(k=>editorButton(k,EDIT_NAMES[k])).join('')+'</div>';
}
function editorControls(b) {
  if(!b||!TYPES[b.type])return '<p class="tiny">Permanent expedition infrastructure.</p>';
  if(b.upgradeOrder)return '<p>Cancel the upgrade before dismantling or relocating.</p>';
  if(b.editOrder){
    const action=b.editOrder.kind==='move'?'Dismantling for relocation':'Dismantling';
    return '<p>'+action+' · '+Math.floor(100*b.editOrder.progress/editorWorkTime(b))+'%</p>'+editorButton('withdraw','Withdraw order',b.id);
  }
  if(!b.finished) return '<div class="buttongroup">'+editorButton('priority',b.buildPriority?'Normal priority':'Build first',b.id)+
    editorButton('pause',b.buildPaused?'Resume construction':'Pause construction',b.id)+
    (b.reconstructing?'':editorButton('cancel-site','Cancel blueprint',b.id))+'</div>';
  return '<div class="buttongroup">'+editorButton('move','Relocate',b.id)+editorButton('demolish','Dismantle',b.id)+'</div>';
}
function editorBegin(mode,b=null) {
  if(!EDIT_NAMES[mode])return;
  closeSheet();selectedType=preview=selectedFeature=selectedPile=selectedBuilding=selectedTerrain=selectedColonist=null;
  editor={mode,bid:b?.id,cells:[],start:null,end:null,stroke:null,pan:false,filter:'all'};
  paintHUD();
}
function editorTarget(x,y,w,h,except=null) {
  return S.buildings.some(b=>b!==except&&b.editOrder?.dest&&x<b.editOrder.dest.x+b.w&&x+w>b.editOrder.dest.x&&y<b.editOrder.dest.y+b.h&&y+h>b.editOrder.dest.y);
}
function editorConnect(cells,point) {
  // Four-connected raster stroke. Revisiting a previous cell trims the tail.
  const append=(x,y)=>{
    const i=cells.findIndex(q=>q.x===x&&q.y===y);
    if(i>=0)cells.splice(i+1);else cells.push({x,y});
  };
  if(!cells.length){append(point.x,point.y);return}
  let {x,y}=cells.at(-1);
  while(x!==point.x||y!==point.y){
    if(Math.abs(point.x-x)>=Math.abs(point.y-y))x+=Math.sign(point.x-x);
    else y+=Math.sign(point.y-y);
    append(x,y);
  }
}
function editorPoint(e) {
  const r=canvas.getBoundingClientRect(), p=screenToWorld(e.clientX-r.left,e.clientY-r.top);
  return {x:clamp(Math.floor(p.x),0,VW-1),y:clamp(Math.floor(p.y),0,VH-1)};
}
function editorMarkPoint(point,first) {
  if(['path','road','remove'].includes(editor.mode))editorConnect(editor.cells,point);
  else if(editor.mode==='move'){editor.end=point}
  else{if(first)editor.start=point;editor.end=point}
}
function editorDown(e) {
  if(!editor||editor.pan)return;
  if(pointers.size===2&&editor.stroke){
    Object.assign(editor,editor.stroke.undo);editor.stroke=null;paintHUD();return;
  }
  if(pointers.size!==1)return;
  editor.stroke={id:e.pointerId,undo:{cells:editor.cells.slice(),start:editor.start,end:editor.end}};
  editorMarkPoint(editorPoint(e),true);paintHUD();
}
function editorMove(e) {
  if(!editor||editor.stroke?.id!==e.pointerId||pointers.size!==1)return false;
  editorMarkPoint(editorPoint(e),false);paintHUD();return true;
}
function editorEnd(e) {
  if(!editor||editor.stroke?.id!==e.pointerId)return false;
  if(e.type==='pointercancel')Object.assign(editor,editor.stroke.undo);
  else editorMarkPoint(editorPoint(e),false);
  editor.stroke=null;paintHUD();return true;
}
function editorPlan() {
  if(!editor)return {valid:false};
  const mode=editor.mode;
  if(['path','road','remove'].includes(mode)){
    const add=editor.cells.filter(q=>!buildingAt(q.x,q.y));
    const paths=editor.cells.map(q=>buildingAt(q.x,q.y)).filter(b=>b&&['path','road'].includes(b.type)&&!b.editOrder);
    if(mode==='remove')return {paths,valid:paths.length>0,description:paths.length+' path tiles to lift'};
    const blocked=editor.cells.some(q=>!fog[index(q.x,q.y)]||(!['path','road'].includes(buildingAt(q.x,q.y)?.type)&&!clearFootprint(q.x,q.y,1,1)));
    const kind=mode==='road'?'composite':'scrap',cost=add.length*TYPES[mode].cost[kind];
    return {add,valid:!blocked&&cost>0&&freightAvailable(kind)>=cost,description:add.length+' new tiles · '+cost+' '+MATERIALS[kind].name.toLowerCase()+(blocked?' · blocked route':freightAvailable(kind)<cost?' · insufficient salvage':'')};
  }
  if(mode==='move'){
    const b=S.buildings.find(b=>b.id===editor.bid),d=editor.end;
    const valid=b&&d&&!b.editOrder&&editorClear(d.x,d.y,b.w,b.h)&&!frontierPlacementReason(b.type,d.x,d.y,b.id);
    return {b,d,valid,description:d?(valid?'Clear reconstruction site':'Site obstructed'):'Tap a clear site for the new footprint'};
  }
  const a=editor.start,z=editor.end;
  const list=!a||!z?[]:features.filter(f=>f.x>=Math.min(a.x,z.x)&&f.x<=Math.max(a.x,z.x)&&f.y>=Math.min(a.y,z.y)&&f.y<=Math.max(a.y,z.y)&&fog[index(f.x,f.y)]&&(editor.filter==='all'||f.type===editor.filter)&&Boolean(S.designations?.[f.id])===(mode==='clear'));
  return {list,valid:!!list.length,description:list.length+' field orders '+(mode==='clear'?'to cancel':'to queue')};
}
function editorClear(x,y,w,h) {
  if(!clearFootprint(x,y,w,h))return false;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(!fog[index(x+i,y+j)])return false;
  return true;
}
function editorPanel(){
  const plan=editorPlan(), area=['mark','clear'].includes(editor.mode);
  const filter=area?'<label>Targets <select data-edit-filter>'+Object.entries({all:'Everything',tree:'Trees',ore:'Minerals',scrap:'Salvage',bush:'Forage'}).map(([key,n])=>'<option value="'+key+'" '+(editor.filter===key?'selected':'')+'>'+n+'</option>').join('')+'</select></label>':'';
  return '<div class="inspectcard inspectnatural"><div class="label">'+EDIT_NAMES[editor.mode]+'</div><div class="meta">'+(editor.pan?'Drag to pan. Switch back to draw.':area?'Drag a rectangle.':editor.mode==='move'?'Tap to position.':'Drag to draw. Retrace to trim.')+' '+plan.description+'</div>'+filter+
    '<div class="buttongroup">'+editorButton('pan',editor.pan?'Draw':'Pan')+editorButton('undo','Reset')+'<button class="primary" data-editor="confirm" '+(!plan.valid?'disabled':'')+'>Confirm</button>'+editorButton('dismiss','Close')+'</div></div>';
}
function editorConfirm(){
  const plan=editorPlan();if(!plan.valid)return;
  if(['path','road'].includes(editor.mode)){
    for(const q of plan.add){
      const b={id:uid++,type:editor.mode,x:q.x,y:q.y,w:1,h:1,progress:0,finished:false};
      if(!freightReserve(TYPES[editor.mode].cost,b))break;
      S.buildings.push(b);
    }
  }else if(editor.mode==='remove'){
    for(const b of plan.paths){if(b.finished)editorOrder(b,'demolish');else editorCancelSite(b)}
  }else if(editor.mode==='move'){editorOrder(plan.b,'move',plan.d)}
  else{
    for(const f of plan.list){
      if(editor.mode==='mark'){S.designations[f.id]={progress:0};for(const p of S.colonists)if(p.task?.feature===f.id&&p.task.type!=='harvest'){p.task=null;p.path=[]}}
      else{delete S.designations[f.id];for(const p of S.colonists)if(p.task?.feature===f.id){p.task=null;p.path=[]}}
    }
    dispatchFieldWork();
  }
  notice(plan.description);editor=null;renderUI(true);save();
}
function editorWorkTime(b){return ['path','road'].includes(b.type)?1.6:Math.max(5,TYPES[b.type].time*.42)}
function editorEvacuate(b) {
  for(const p of S.colonists){
    const related=p.visit?.building===b.id||p.task?.id===b.id||(p.task?.x===b.x&&p.task?.y===b.y);
    if(related){FarwakeDoors.restore(p,S.buildings);p.task=null;p.path=[];p.action=0;}
  }
}
function editorOrder(b,kind,dest=null){
  if(!b?.finished||!TYPES[b.type]||b.editOrder||b.upgradeOrder)return;
  b.editOrder={kind,progress:0,...(dest?{dest:{...dest}}:{})};
  editorEvacuate(b);
  if(b.inputOrder||Object.values(b.siteStock||{}).some(n=>n>0)){freightCancel(b);b.inputOrder=false}
  if(b.type==='shed'||FRONTIER_BUILDINGS[b.type]?.storage)freightRemoveStore(b);
  if(housingBeds(b)){housingRelease(b);housingAllocate()}
  // Free the dispatch queue so an indefinitely researching builder can respond.
  for(const p of S.colonists)if(['Commander','Engineer'].includes(p.role)&&p.task?.type==='research'){p.task=null;p.path=[]}
}
function editorCancelSite(b){
  if(b.finished||b.reconstructing||!TYPES[b.type])return;
  editorEvacuate(b);
  freightCancel(b,1);
  S.buildings=S.buildings.filter(v=>v!==b);selectedBuilding=null;
}
function editorCandidate(p) {
  const upgrade=S.buildings.find(b=>b.upgradeOrder&&freightSiteReady(b)&&!S.colonists.some(q=>q!==p&&q.task?.type==='upgrade'&&q.task.id===b.id));
  if(upgrade)return {type:'upgrade',id:upgrade.id,x:upgrade.x,y:upgrade.y,w:upgrade.w,h:upgrade.h};
  if(p.work==='survey'||!(p.work==='build'||['Engineer','Commander','Medic'].includes(p.role)))return null;
  const b=S.buildings.find(b=>b.editOrder&&!S.colonists.some(other=>other!==p&&other.task?.type==='dismantle'&&other.task.id===b.id));
  return b?{type:'dismantle',id:b.id,x:b.x,y:b.y,w:b.w,h:b.h}:null;
}
function editorWork(p,work){
  frontierAccessCache=null;
  const b=S.buildings.find(q=>q.id===p.task?.id);
  if(!b?.editOrder){p.task=null;return}
  const o=b.editOrder;
  o.progress+=work*(p.role==='Engineer'?1.6:1);
  if(o.progress<editorWorkTime(b))return;
  if(b.type==='shed'||FRONTIER_BUILDINGS[b.type]?.storage)freightRemoveStore(b);
  editorEvacuate(b);
  if(o.kind==='move'){
    const dest=o.dest;
    delete b.editOrder;
    Object.assign(b,{x:dest.x,y:dest.y,finished:false,progress:0,reservedMaterials:{},siteStock:{},reconstructing:true,buildPaused:false});
    log('',TYPES[b.type].name+' dismantled. The crew will rebuild it at the marked site.');
  }else{
    const refund=Object.fromEntries(Object.entries(TYPES[b.type].cost).map(([k,n])=>[k,['path','road'].includes(b.type)?n:Math.floor(n*.5)]));
    S.buildings=S.buildings.filter(q=>q!==b);
    delete b.editOrder;freightRefund(refund,b);if(selectedBuilding===b.id)selectedBuilding=null;
    log('',TYPES[b.type].name+' dismantled. Salvage left on site.');
  }
  p.task=null;housingAllocate();save();paintHUD();
}
function editorOverlay() {
  ctx.save();
  function tile(x,y,w=1,h=1,warning=false) {
    ctx.fillStyle=warning?'#d7837050':'#e0c78a4d';ctx.strokeStyle=warning?'#e59e89':'#edcf8f';ctx.lineWidth=1;
    ctx.fillRect(x*TS,y*TS,w*TS,h*TS);ctx.strokeRect(x*TS+1,y*TS+1,w*TS-2,h*TS-2);
  }
  for(const b of S.buildings)if(b.editOrder?.dest)tile(b.editOrder.dest.x,b.editOrder.dest.y,b.w,b.h);
  if(editor){
    if(editor.mode==='move'&&editor.end){const b=S.buildings.find(v=>v.id===editor.bid);if(b)tile(editor.end.x,editor.end.y,b.w,b.h,!editorPlan().valid)}
    else if(editor.cells.length){for(const q of editor.cells)tile(q.x,q.y,1,1,editor.mode==='remove'||(!clearFootprint(q.x,q.y,1,1)&&!['path','road'].includes(buildingAt(q.x,q.y)?.type)))}
    else if(editor.start&&editor.end){const a=editor.start,z=editor.end;tile(Math.min(a.x,z.x),Math.min(a.y,z.y),Math.abs(a.x-z.x)+1,Math.abs(a.y-z.y)+1)}
  }
  ctx.restore();
}
function editorPaths(time,left,top,right,bottom){
  const paths=S.buildings.filter(b=>['path','road'].includes(b.type)), laid=new Set(paths.filter(b=>b.finished).map(b=>index(b.x,b.y)));
  for(const b of paths){
    if(b.x<left||b.x>=right||b.y<top||b.y>=bottom)continue;
    if(!b.finished){renderBuilding(b,time);continue}
    const x=b.x*TS,y=b.y*TS;
    ctx.fillStyle=b.type==='road'?'#535d5b':'#897d66';ctx.fillRect(x+6,y+6,20,20);ctx.fillStyle=b.type==='road'?'#87918b':'#b0a087';ctx.fillRect(x+7,y+7,17,17);
    for(const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]])if(inMap(b.x+dx,b.y+dy)&&laid.has(index(b.x+dx,b.y+dy))){
      ctx.fillRect(x+(dx<0?0:dx>0?20:7),y+(dy<0?0:dy>0?20:7),dx?12:17,dy?12:17);
    }
    if(b.type==='road'){ctx.fillStyle='#bbab79';ctx.fillRect(x+14,y+12,2,7)}
    FarwakeHearth.draw(ctx,b,time,S.minute,S.weather,{},FieldPreferences.reduced);
    for(let i=0;i<3;i++){ctx.fillStyle=i%2?'#897e69':'#c4b9a0';ctx.fillRect(x+7+Math.floor(hash(b.x,b.y,i)*12),y+9+i*5,4,1);}
  }
}
document.addEventListener('change',e=>{if(editor&&e.target.matches('[data-edit-filter]')){editor.filter=e.target.value;paintHUD()}});
document.addEventListener('click',e=>{
 const button=e.target.closest('[data-editor]');if(!button)return;
 const a=button.dataset.editor,b=S.buildings.find(b=>b.id===Number(button.dataset.building));
 if(EDIT_NAMES[a]){if(a!=='move'||b?.finished)editorBegin(a,b);return}
 if(a==='confirm'){editorConfirm();return}
 if(editor){
   if(a==='dismiss')editor=null;
   else if(a==='pan')editor.pan=!editor.pan;
   else if(a==='undo'){editor.cells=[];editor.start=editor.end=null}
   paintHUD();return;
 }
 if(!b||!TYPES[b.type])return;
 if(a==='demolish'||a==='cancel-site'){
   const message=a==='demolish'?'A worker will dismantle this structure. Half of its original materials are recovered, rounded down per material. Stone paths return their full paving. Residents lose this address and stored goods move outside.':'Reserved materials are released and delivered materials return to the ground.';
   showSheet(sectionHeader(a==='demolish'?'Dismantle '+TYPES[b.type].name+'?':'Cancel this blueprint?','SETTLEMENT EDITOR')+'<p>'+message+'</p>'+editorButton('apply-'+a,'Confirm',b.id,true)+editorButton('back','Keep',b.id));return;
 }
 if(a==='apply-demolish')editorOrder(b,'demolish');
 if(a==='apply-cancel-site')editorCancelSite(b);
 if(a==='withdraw'){delete b.editOrder;for(const p of S.colonists)if(p.task?.type==='dismantle'&&p.task.id===b.id){p.task=null;p.path=[]}housingAllocate()}
 if(a==='priority')b.buildPriority=!b.buildPriority;
 if(a==='pause'){b.buildPaused=!b.buildPaused;if(b.buildPaused)editorEvacuate(b)}
 closeSheet();renderUI(true);save();
});

// Production records live on the building, so a worker change or save never resets a batch.
const INDUSTRY_RECIPES = {
  smelt:{name:'Smelt ore',cost:{ore:2,scrap:1},yield:1,seconds:9},
  recycle:{name:'Reclaim scrap',cost:{scrap:6},yield:1,seconds:13},
  precision:{name:'Precision casting',cost:{ore:3,scrap:1},yield:2,seconds:13,tech:'metallurgy'}
};
const INDUSTRY_STAGES = {
  plant:{label:'Planting',seconds:4}, germinate:{label:'Germinating',seconds:15},
  tend:{label:'Tending seedlings',seconds:3}, grow:{label:'Growing',seconds:22},
  harvest:{label:'Harvesting ripe crops',seconds:5}
};
function industryPolicy(){
  if(!S.industry) S.industry={};
  const c=S.industry;
  c.targets??={wood:40,ore:24,scrap:150,food:180,alloy:20};
  c.weights??={field:1,factory:1,gather:1};
  c.harvests??=0;c.batches??=0;
  return c;
}
function foundingProductionRecord(b){
  return b.production??=(b.type==='garden'
    ? {stage:'plant',elapsed:0,cycles:0,output:0}
    : {recipe:'smelt',elapsed:0,cycles:0,output:0});
}
function industryOwned(kind){return (S.resources[kind]||0)+looseTotal(kind)+transitTotal(kind)}
function industryFoodEmergency(){return industryOwned('food')+industryOwned('meals')<1&&S.colonists.some(p=>p.hunger>67)}
function industryTarget(kind){
  const target=industryPolicy().targets[kind]||0;
  // A temporary survival floor never overwrites the player's saved stock target.
  return kind==='food'&&industryFoodEmergency()?Math.max(target,S.colonists.length*2):target;
}
function foundingIndustryRecipes(){return Object.entries(INDUSTRY_RECIPES).filter(([,r])=>!r.tech||S.research.includes(r.tech))}
function chosenRecipe(r){return INDUSTRY_RECIPES[r.recipe]||INDUSTRY_RECIPES.smelt}
function cropYield(){return S.research.includes('growth')?11:7}
function cropDuration(stage){
  const growing=stage==='germinate'||stage==='grow';
  return INDUSTRY_STAGES[stage].seconds*(growing&&S.research.includes('irrigation')?.7:1);
}
function cropNeedsWorker(stage){return !['grow','germinate'].includes(stage)}
function foundingProductionBlock(b){
  if(!b.finished||b.editOrder)return 'Unavailable during construction or dismantling';
  const r=productionRecord(b),kind=b.type==='garden'?'food':'alloy';
  if(r.paused)return 'Paused by colony order';
  if(industryOwned(kind)>=industryTarget(kind))return 'Colony stock target reached';
  if(b.type==='garden')return '';
  const recipe=chosenRecipe(r);
  const grid=power();
  if(grid.supply<grid.used)return 'Insufficient grid power';
  for(const [k,amount] of Object.entries(recipe.cost))if((S.resources[k]||0)<amount)return 'Needs '+amount+' stored '+MATERIALS[k].name.toLowerCase();
  return '';
}
function productionWorkers(b){return S.colonists.filter(p=>p.task?.id===b.id&&['farm','craft'].includes(p.task.type))}
function foundingIndustrySummary(b){
  if(!['garden','workshop'].includes(b.type)&&!frontierProducer(b))return '';
  const blocked=productionBlock(b);if(blocked)return blocked;
  const r=productionRecord(b),worker=productionWorkers(b)[0];
  if(b.type==='garden'&&industryFoodEmergency())return 'Emergency food recovery · '+INDUSTRY_STAGES[r.stage].label;
  if(b.type==='garden'&&!cropNeedsWorker(r.stage))return INDUSTRY_STAGES[r.stage].label;
  if(!worker)return 'Waiting for '+(r.worker?S.colonists.find(p=>p.id===r.worker)?.name||'assigned worker':'an available worker');
  return worker.path.length?'Worker approaching':(b.type==='garden'?INDUSTRY_STAGES[r.stage].label:'Manufacturing')+' · '+worker.name;
}
function productionWeight(p,b){
  const isFarm=b.type==='garden'||b.type==='greenhouse',group=isFarm?'field':'factory',r=productionRecord(b);
  if(r.worker&&r.worker!==p.id)return 0;
  if(r.worker===p.id)return 100;
  if(b.type==='garden'&&industryFoodEmergency())return 3;
  if(p.work==='survey')return 0;
  const personal=p.workWeights?.[group]??1,colony=industryPolicy().weights[group]??1;
  if(!personal||!colony)return 0;
  const adept=isFarm?p.role==='Biologist'||p.work==='farm':p.role==='Engineer'||p.work==='engineer';
  if(!adept&&personal===1&&colony===1)return 0;
  return personal*colony*(adept?2:1);
}
function productionCandidate(p,type){
  const choices=[];
  for(const b of S.buildings){
    if((type&&!(type==='workshop'?b.type==='workshop'||frontierProducer(b)&&b.type!=='greenhouse':type==='garden'?['garden','greenhouse'].includes(b.type):b.type===type))||!(['garden','workshop'].includes(b.type)||frontierProducer(b))||!b.finished||b.editOrder)continue;
    if(b.type==='workshop')frontierAutoRecipe(b);
    const r=productionRecord(b),weight=productionWeight(p,b);
    if(!weight||productionBlock(b)||b.type==='garden'&&!cropNeedsWorker(r.stage))continue;
    if(productionWorkers(b).some(worker=>worker.id!==p.id))continue;
    choices.push({b,rank:weight*100-Math.hypot(b.x-p.x,b.y-p.y)});
  }
  choices.sort((a,b)=>b.rank-a.rank);
  for(const {b} of choices){
    const task={type:b.type==='garden'?'farm':'craft',id:b.id,x:b.x,y:b.y,w:b.w,h:b.h};
    if(setTask(p,task))return task;
  }
  return null;
}
function nextCrop(r,stage){r.stage=stage;r.elapsed=0}
function advanceCrops(step){
  for(const b of S.buildings){
    if(!b.finished||b.type!=='garden'||b.editOrder)continue;
    const r=productionRecord(b);
    if(r.paused||cropNeedsWorker(r.stage))continue;
    r.elapsed+=step;
    if(r.elapsed>=cropDuration(r.stage))nextCrop(r,r.stage==='grow'?'harvest':'tend');
  }
}
function foundingProduction(p,t,work){
  const b=S.buildings.find(b=>b.id===t.id);
  if(!b||productionBlock(b)||!productionWeight(p,b)){p.task=null;return}
  const r=productionRecord(b);
  if(b.type==='garden'){
    if(!cropNeedsWorker(r.stage)){p.task=null;return}
    r.elapsed+=work;
    if(r.elapsed<cropDuration(r.stage))return;
    if(r.stage==='plant')nextCrop(r,'germinate');
    else if(r.stage==='tend')nextCrop(r,'grow');
    else{
      // Ripe food waits on the bed if there is less demand than a full harvest.
      r.ripe??=cropYield();
      const n=Math.min(r.ripe,Math.max(0,industryTarget('food')-industryOwned('food')));
      if(n){freightOutput('food',n,b);r.output+=n;r.ripe-=n}
      if(!r.ripe){delete r.ripe;nextCrop(r,'plant');r.cycles++;industryPolicy().harvests++}
    }
  }else{
    const recipe=chosenRecipe(r);
    r.elapsed+=work;if(r.elapsed<recipe.seconds)return;

function advanceGatherTargets(step){
  const c=industryPolicy();nextAutoGather-=step;
  if(nextAutoGather>0)return;nextAutoGather=5;
  if(!c.weights.gather||!S.colonists.some(p=>['auto','gather','build'].includes(p.work)))return;
  const anchor=S.buildings.find(b=>b.type==='supplies')||S.colonists[0];
  if(!anchor)return;
  for(const [kind,type] of [['wood','tree'],['ore','ore'],['scrap','scrap'],['food','bush']]){
    const committed=Object.keys(S.designations||{}).reduce((n,id)=>{const f=featureById(id);return n+(f?.type===type?(f.amount??NATURAL[type].amount):0)},0);
    if(industryOwned(kind)+committed>=c.targets[kind])continue;
    const candidates=features.filter(f=>f.type===type&&fog[index(f.x,f.y)]&&!S.designations[f.id]).sort((a,b)=>Math.hypot(a.x-anchor.x,a.y-anchor.y)-Math.hypot(b.x-anchor.x,b.y-anchor.y));
    for(const f of candidates.slice(0,18)){
      const goals=neighborGoals(f.x,f.y);
      if(!S.colonists.some(p=>goals.some(g=>Math.floor(p.x)===g.x&&Math.floor(p.y)===g.y)||findPath(p.x,p.y,goals).length))continue;
      S.designations[f.id]={progress:0,automatic:true};
      break;
    }
  }
}
function drawProduction(b,x,y){
  if(b.type!=='garden'||!b.finished)return;
  const r=productionRecord(b), stage=r.stage;
  for(let row=0;row<3;row++){
    const y0=y+6+row*18;
    rect(x+9,y0+2,66,10,'#564133');
    for(let i=0;i<9;i++){
      const px=x+11+i*7,py=y0+7+(i%2);
      rect(px,py,5,1,'#795743');
      if(stage==='plant'&&i>Math.floor(r.elapsed*2))continue;
      rect(px+2,py-1,2,2,'#9f975e');
      if(stage==='plant')continue;
      const fraction=r.elapsed/cropDuration(stage);
      const size=stage==='germinate'?1+Math.min(2,Math.floor(fraction*3)):stage==='tend'?3:stage==='grow'?3+Math.min(3,Math.floor(fraction*4)):6;
      rect(px+2,py-size,2,size,'#8da26a');rect(px,py-size+1,3,2,'#61916a');
      if(size>3)rect(px+3,py-size,3,2,'#acba71');
      if(stage==='harvest')rect(px+1,py-3,3,2,'#cf8959');
    }
  }
}

function surveyDistances(x,y,passable){
 const result=new Int16Array(VW*VH).fill(-1);
 const queue=new Int32Array(result.length);
 const a=index(clamp(Math.floor(x),0,VW-1),clamp(Math.floor(y),0,VH-1));
 let first=0,last=1;queue[0]=a;result[a]=0;
 while(first<last){
   const i=queue[first++],xx=i%VW,yy=(i-xx)/VW;
   for(const [dx,dy] of [[0,-1],[1,0],[0,1],[-1,0]]){
     const nx=xx+dx,ny=yy+dy,j=index(nx,ny);
     if(inMap(nx,ny)&&result[j]===-1&&passable(nx,ny)){result[j]=result[i]+1;queue[last++]=j}
   }
 }
 return result;
}
function restoreStarterOre(){
 const retired=new Set(S.harvested||[]);
 const byId=new Set(features.map(f=>f.id));
 if(!Array.isArray(S.starterOre)){
   const distance=surveyDistances(28,28,(x,y)=>terrain[index(x,y)].kind!=='water');
   const reachable=(x,y)=>distance[index(x,y)]>=0;
   // Reconstruct against unharvested geology, even when loading an older mined world.
   const generated=new Set(features.map(f=>f.x+','+f.y));
   const nearby=features.filter(f=>f.type==='ore'&&reachable(f.x,f.y)&&Math.hypot(f.x-28,f.y-28)<=19).length;
   const candidates=[];
   for(let y=12;y<=44;y++)for(let x=12;x<=44;x++){
     const d=Math.hypot(x-28,y-28);
     if(d>=10&&d<=17&&reachable(x,y)&&!generated.has(x+','+y))candidates.push({x,y,preferred:hash(x,y,hashStr(S.seed)+337)>=.77});
   }
   candidates.sort((a,b)=>Number(b.preferred)-Number(a.preferred));
   S.starterOre=candidates.slice(0,Math.max(0,3-nearby)).map(({x,y})=>({x,y}));
 }
 for(const {x,y} of S.starterOre){
   if(!Number.isInteger(x)||!Number.isInteger(y)||!inMap(x,y))continue;
   const id='starterore-'+x+'-'+y;
   if(!retired.has(id)&&!byId.has(id)&&!buildingAt(x,y)&&!featureAt(x,y)){
      features.push({x,y,id,type:'ore'});byId.add(id);
   }
 }
 S.oreStarterChecked=true;
}

function frontierProducer(b){return !!FRONTIER_BUILDINGS[b.type]?.recipe}

 return b.production;
}
function productionBlock(b){
 if(!frontierProducer(b))return foundingProductionBlock(b);
 const r=productionRecord(b),recipe=FRONTIER_RECIPES[r.recipe];
 if(!b.finished||b.editOrder||b.upgradeOrder)return 'Facility is under construction';
 if(r.paused)return b.autoPowerHold?'Grid standby · needs '+(-TYPES[b.type].power)+' spare power':'Production paused';
 if(!recipe||recipe.facility!==b.type)return 'Select a facility recipe';
 if(power().supply<power().used)return 'Insufficient grid power';
 const over=Object.keys(recipe.output).some(k=>industryOwned(k)>=industryTarget(k));
 if(over&&!r.batch)return 'Output target reached';
 if(b.type==='drill'&&!frontierSeam(b))return 'No investigated ore seam within six tiles';
 if(!r.batch){
  for(const [k,n] of Object.entries(recipe.cost)){
   if((b.siteStock?.[k]||0)<n)return b.inputOrder?'Awaiting physical '+MATERIALS[k].name+' delivery':'Needs '+n+' '+MATERIALS[k].name;
  }
 }
 return '';
}
function industrySummary(b){

function performProduction(p,t,work){
 const b=S.buildings.find(b=>b.id===t.id);
 if(!b||!frontierProducer(b))return foundingProduction(p,t,work);
 const r=productionRecord(b),recipe=FRONTIER_RECIPES[r.recipe];
 if(productionBlock(b)){p.task=null;return}
 if(!r.batch){
   for(const [k,n] of Object.entries(recipe.cost)){b.siteStock[k]-=n;freightFlow(k,n,'consumed')}
   r.batch=true;b.inputOrder=false;delete b.reservedMaterials;
 }
 r.elapsed+=work;
 if(r.elapsed<recipe.seconds)return;
 for(const [kind,n] of Object.entries(recipe.output)){
   freightOutput(kind,n,b);frontierState().produced[kind]=(frontierState().produced[kind]||0)+n;
 }
 if(b.type==='drill')frontierSeam(b).remaining-=recipe.output.ore;
 r.batch=false;r.elapsed=0;r.cycles++;r.output+=Object.values(recipe.output).reduce((n,v)=>n+v,0);industryPolicy().batches++;
 p.task=null;p.action=0;save();
}
function frontierRequestInputs(b){

 const r=productionRecord(b),recipe=FRONTIER_RECIPES[r.recipe];
 if(r.paused||r.batch||b.inputOrder||!recipe)return;
 if(Object.keys(recipe.output).some(k=>industryOwned(k)>=industryTarget(k)))return;
 if(Object.keys(recipe.cost).length&&freightReserve(recipe.cost,b))b.inputOrder=true;

function frontierSeedSites(){
 const f=frontierState();if(f.worldVersion)return;
 const reach=surveyDistances(28,29,(x,y)=>terrain[index(x,y)].kind!=='water');
 const used=f.sites.filter(s=>Number.isFinite(s.x));
 for(let i=0;i<8;i++){
  const candidates=[];
  for(let y=3;y<VH-3;y++)for(let x=3;x<VW-3;x++){
   const d=Math.hypot(x-28,y-28);
   if(reach[index(x,y)]<0||buildingAt(x,y)||d<(i<2?10:17)||d>(i<2?16:32)||used.some(s=>Math.hypot(s.x-x,s.y-y)<7))continue;
   candidates.push({x,y,rank:hash(x,y,hashStr(S.seed)+2301+i*313)});
  }
  candidates.sort((a,b)=>b.rank-a.rank);const q=candidates[0];if(!q)continue;
  const site={id:'frontier-site-'+i,kind:['wreck','seam','ruin','anomaly'][i%4],x:q.x,y:q.y,seen:false,resolved:false,progress:0};
  f.sites.push(site);used.push(site);
 }
 f.worldVersion=1;
}

  if(s.seen||!Number.isFinite(s.x)||!fog[index(s.x,s.y)])continue;

function frontierSiteReach(s){

function frontierSurfaceGeology(){
 const f=frontierState();
 if(!Array.isArray(f.surfaceDeposits)){
  const reach=surveyDistances(28,29,(x,y)=>terrain[index(x,y)].kind!=='water');
  const candidates=[];
  for(let y=3;y<VH-3;y++)for(let x=3;x<VW-3;x++){
   const d=Math.hypot(x-28,y-28);
   if(d<10||d>27||reach[index(x,y)]<0||buildingAt(x,y)||featureAt(x,y))continue;
   candidates.push({x,y,near:d<=16,rank:hash(x,y,hashStr(S.seed)+6127)});
  }
  candidates.sort((a,b)=>Number(b.near)-Number(a.near)||b.rank-a.rank);
  f.surfaceDeposits=[];
  for(const q of candidates){
   if(f.surfaceDeposits.some(p=>Math.hypot(p.x-q.x,p.y-q.y)<3))continue;
   f.surfaceDeposits.push({x:q.x,y:q.y,amount:9});if(f.surfaceDeposits.length>=16)break;
  }
 }
 const retired=new Set(S.harvested||[]),existing=new Set(features.map(p=>p.id));
 for(const q of f.surfaceDeposits){
  const id='frontier-ore-'+q.x+'-'+q.y;
  if(retired.has(id)||existing.has(id)||buildingAt(q.x,q.y))continue;
  features.push({...q,id,type:'ore',workTime:18});existing.add(id);
 }
 f.surfaceVersion=1;
}

let frontierAccessCache=null,approachCache=null;

function siteApproachOpen(b){

 if(approachCache.map.has(b.id))return approachCache.map.get(b.id);

 if(anchor){
  const door=FarwakeBuildings.entrance(anchor);
  if(door){
   const sx=anchor.x+Math.floor((door.x+door.w/2)/32),sy=anchor.y+anchor.h;
   const dist=surveyDistances(sx,sy,walkable);
   open=neighborGoals(b.x,b.y,b.w,b.h).some(q=>dist[index(q.x,q.y)]>=0);

}

function frontierAccessReason(type,x,y,ignoreId){
 const key=[type,x,y,ignoreId,approachStamp(),waterCount(),uid].join(':');
 if(frontierAccessCache?.state===S&&frontierAccessCache.key===key)return frontierAccessCache.reason;
 const t=TYPES[type],anchor=S.buildings.find(b=>b.type==='lander');
 if(!anchor||!t)return '';
 const port=b=>{const d=FarwakeBuildings.entrance(b);return d?{x:b.x+Math.floor((d.x+d.w/2)/32),y:b.y+b.h}:null};
 const start=port(anchor);if(!start)return '';
 const blocked=(xx,yy)=>xx>=x&&xx<x+t.w&&yy>=y&&yy<y+t.h;
 const pass=(xx,yy)=>inMap(xx,yy)&&terrain[index(xx,yy)].kind!=='water'&&!S.buildings.some(b=>b.id!==ignoreId&&!['path','road'].includes(b.type)&&xx>=b.x&&xx<b.x+b.w&&yy>=b.y&&yy<b.y+b.h);

 if(next&&after[index(next.x,next.y)]<0)reason='The entrance needs a connected route to the settlement';
 if(!next&&!neighborGoals(x,y,t.w,t.h).some(q=>!blocked(q.x,q.y)&&after[index(q.x,q.y)]>=0))reason='Construction crews need a connected approach to this site';
 for(const b of S.buildings){
  if(reason||b.id===ignoreId)continue;const d=port(b);
  if(d&&before[index(d.x,d.y)]>=0&&after[index(d.x,d.y)]<0)reason='This would cut off '+facilityName(b)+'. Leave a connected route.';
  if(!reason&&!b.finished&&!['path','road'].includes(b.type)){
   const around=neighborGoals(b.x,b.y,b.w,b.h);
   if(around.some(q=>before[index(q.x,q.y)]>=0)&&!around.some(q=>!blocked(q.x,q.y)&&after[index(q.x,q.y)]>=0))reason='This would cut off '+facilityName(b)+'. Leave a connected route.';
  }
  if(!reason&&b.type==='supplies'){
   const around=neighborGoals(b.x,b.y,b.w,b.h);
   if(around.some(q=>before[index(q.x,q.y)]>=0)&&!around.some(q=>!blocked(q.x,q.y)&&after[index(q.x,q.y)]>=0))reason='This would cut off the supply pallet. Leave a hauling route.';
  }
 }
 frontierAccessCache={state:S,key,reason};return reason;
}

 const b=lifeBuilding(t.id),target=phase==='greeting'||phase==='goodbye'?other:kind==='sky'?{x:p.x,y:p.y-8}:kind==='plants'&&b?{x:b.x+b.w/2,y:b.y+b.h/2}:other;
 return {kind,phase,progress:session?session.progress:p.action,look:target||null,shared:!!session,
  familiar:!!other&&lifePerson(p).bonds.some(b=>b.person===other.id&&b.shared>=3),building:t.id};
}
function lifePanel(p){
 const l=lifePerson(p),memories=l.memories.slice(0,4),bonds=l.bonds.map(q=>({q,p:S.colonists.find(p=>p.id===q.person)})).filter(q=>q.p);
 return '<section class="infocard life-profile"><b>'+esc(lifeDescription(p)||'An evening of their own')+'</b><p>'+esc(l.company>=.7?'Often seeks company':l.interest==='plants'?'Finds calm around growing things':l.interest==='sky'?'Drawn to quiet skies':'Enjoys small personal projects')+'</p><details><summary>People, places & memories</summary><p>'+esc(bonds.map(({q,p})=>p.name+' · '+(q.shared>=3?'familiar companion':'getting acquainted')).join('; ')||'Friendships grow through time actually spent together.')+'</p>'+memories.map(m=>'<p><small>Day '+m.day+'</small><br>'+esc(m.text)+(m.count>1?' · '+m.count+' evenings':'')+'</p>').join('')+'</details></section>';
}
// Brief daytime pauses are transient, unrewarded and only fill genuinely idle
// time. New work, hunger and nightfall release them immediately.
const lifeIdleNext=new WeakMap();
function lifeDirectedStandby(p){return !!p.workWeights&&Object.keys(workGroups).every(k=>(p.workWeights[k]??1)===0)}
function lifeIdleTarget(p){
 if(p.work!=='auto'||lifeDirectedStandby(p)||p.carry||p.energy<60||p.hunger>40||S.minute<420||S.minute>=1050||industryFoodEmergency()||jobs().some(b=>!b.buildPaused))return null;
 const now=lifeRoot().time;if(now<(lifeIdleNext.get(p)||0))return null;
 lifeIdleNext.set(p,now+38+(p.id%5)*7);
 const places=lifePlaces(p).sort((a,b)=>lifeAttachment(p,b.b)-lifeAttachment(p,a.b)||a.b.id-b.b.id);
 for(const place of places.slice(0,4)){
  const point=place.points[(p.id+S.day)%place.points.length];
  const t={type:'idle_pause',id:place.b.id,x:Math.floor(point.x),y:Math.floor(point.y),outdoors:true};
  if(setTask(p,t))return t;
 }
 return null;
}
function lifeIdleWork(p){if(p.action>=8||lifeDirectedStandby(p)||lifeEmergency(p)||jobs().some(b=>!b.buildPaused)||S.minute>=1050){p.task=null;p.path=[];p.action=0}}

// Physical scene props belong to a genuinely attended meeting. No food or
// resource is spawned: these are reusable personal seats and a portable table.
function lifeSceneDraw(c,left,top,right,bottom){
 for(const session of lifeRoot().sessions){
  if(!session.started||session.progress<6||session.progress>=27)continue;
  const people=session.people.map(id=>S.colonists.find(p=>p.id===id));
  if(people.some(p=>!p||p.path.length||p.task?.session!==session.id))continue;
  const x=(people[0].x+people[1].x)*16,y=(people[0].y+people[1].y)*16;
  if(x<left*32||x>right*32||y<top*32||y>bottom*32)continue;
  c.fillStyle='#405650';c.fillRect(x-23,y+1,46,7);c.fillStyle='#b19a6e';c.fillRect(x-10,y-2,20,4);c.fillStyle='#685a43';c.fillRect(x-8,y+2,2,5);c.fillRect(x+6,y+2,2,5);c.fillStyle='#d4c5a1';c.fillRect(x-6,y-5,3,3);c.fillRect(x+4,y-5,3,3);
 }
}

function experienceReason(p){

 if(t?.type==='life_share'){const s=lifeRoot().sessions.find(s=>s.id===t.session),other=s&&S.colonists.find(q=>q.id!==p.id&&s.people.includes(q.id));const familiar=other&&l.bonds.find(q=>q.person===other.id)?.shared>=3;return (familiar?'Chose a familiar companion':'Made time for company')+(b?' near '+facilityName(b).toLowerCase():'')+'.'}
 if(t?.type==='life_home')return ['rain','storm'].includes(S.weather)?'Sheltering from the rain in a home of their own.':'A quiet evening at home, after the day’s work.';

function experienceProfile(id){

 const l=lifePerson(p),companions=l.bonds.map(b=>({b,p:S.colonists.find(q=>q.id===b.person)})).filter(q=>q.p);
 showSheet('<div class="life-profile"><div class="row"><span class="smallcaps">A LIFE ON THE FRONTIER</span><button class="iconbtn" data-sheet="close" aria-label="Close character">×</button></div><div class="person-hero" style="--person-color:'+p.coat+'"><canvas width="80" height="104" data-person-canvas="'+p.id+'" aria-label="Portrait of '+esc(p.name)+'"></canvas><div><h2>'+esc(p.name)+'</h2><p>'+esc(p.role)+' · '+esc(p.trait)+'</p></div></div><div class="intention"><strong data-person-activity>'+esc(taskLabel(p))+'</strong><p data-person-reason>'+esc(experienceReason(p))+'</p></div><div class="need-line"><span>'+ (p.energy<35?'Tired':p.energy<65?'Taking it steadily':'Well rested')+'</span><span>'+(p.hunger>67?'Needs food':p.hunger>35?'Getting hungry':'Has eaten')+'</span><span>'+(p.mood>65?'In good spirits':'Finding their feet')+'</span></div><h3 class="sectioncap">People who matter</h3>'+(companions.length?companions.map(({b,p:q})=>'<button class="crewrow" data-action="crew" data-id="'+q.id+'"><span class="avatar" style="color:'+q.coat+'">'+uiIcon('crew',22)+'</span><span><b>'+esc(q.name)+'</b><div class="sub">'+(b.shared>=3?'A familiar companion':'Getting acquainted')+' · '+b.shared+' shared evenings</div></span></button>').join(''):'<p>Friendships begin with time actually spent together.</p>')+'<h3 class="sectioncap">What stays with them</h3>'+(l.memories.length?l.memories.slice(0,4).map(m=>'<div class="memory"><small>DAY '+m.day+'</small>'+esc(m.text)+'</div>').join(''):'<p>Their story here is just beginning.</p>')+'<details><summary>Home, responsibilities & wellbeing</summary>'+housingPerson(p)+personPriorityControls(p)+'<p>'+esc(p.ambition)+'</p><div class="buttongroup">'+[['auto','Self-direct'],['build','Construction'],['farm','Agriculture'],['engineer','Manufacturing'],['survey','Exploration'],['gather','Salvaging']].map(([k,n])=>'<button class="pill '+(p.work===k?'active':'')+'" data-sheet="work" data-id="'+id+'" data-work="'+k+'">'+n+'</button>').join('')+'</div><p>Energy '+Math.round(p.energy)+'% · Hunger '+Math.round(p.hunger)+'% · Morale '+Math.round(p.mood)+'%</p></details><button class="primary" style="width:100%;margin-top:18px" data-sheet="follow" data-id="'+id+'">Find '+esc(p.name.split(' ')[0])+' in the world</button></div>');
}
function experienceRender(time){
 if(time-experienceLastRender<90)return;experienceLastRender=time;
 if(!$('sheetbg').classList.contains('open'))return;
 const portrait=$('sheet').querySelector('[data-person-canvas]');
 if(portrait){const p=S.colonists.find(p=>p.id===+portrait.dataset.personCanvas);if(p){const c=portrait.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,80,104);c.fillStyle='#243941';c.fillRect(0,0,80,104);c.save();c.translate(40,87);c.scale(3,3);c.translate(-p.x*32,-p.y*32);FarwakePeople.draw(c,p,32,time,false,1);c.restore();const label=$('sheet').querySelector('[data-person-activity]');if(label)label.textContent=taskLabel(p);const reason=$('sheet').querySelector('[data-person-reason]');if(reason)reason.textContent=experienceReason(p)}}
 const room=$('sheet').querySelector('[data-room]');if(room){const b=S.buildings.find(b=>b.id===+room.dataset.room);if(b)FarwakeInteriors.draw(room,b,S,FarwakeDoors.occupants(S,b),time,FieldPreferences.reduced)}
}
