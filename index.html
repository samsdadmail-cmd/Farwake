<script>

(()=>{

const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mod=(x,n)=>(x%n+n)%n;
const ROLE={Commander:'Leadership',Engineer:'Construction',Biologist:'Agriculture',Medic:'Healthcare',Surveyor:'Exploration'};
const PROFILES=[{name:'Aya Mercer',role:'Commander',hue:'#ffc79e',hair:'#302c37',coat:'#ecb872',trait:'Steadfast',ambition:'Build a lasting home'},{name:'Tomas Venn',role:'Engineer',hue:'#ffd2af',hair:'#544031',coat:'#8db8d0',trait:'Inventive',ambition:'Power the first town'},{name:'Mira Solis',role:'Biologist',hue:'#e3a983',hair:'#252b29',coat:'#abcb88',trait:'Patient',ambition:'Grow a thriving garden'},{name:'Ivo Chen',role:'Medic',hue:'#f1c5a3',hair:'#463e44',coat:'#d6a8c5',trait:'Compassionate',ambition:'Keep the expedition safe'},{name:'Nell Ardent',role:'Surveyor',hue:'#d1a282',hair:'#c2a474',coat:'#e5bb83',trait:'Curious',ambition:'Chart the unknown'}];
const TYPES={shelter:{name:'Prefab Home',icon:'⌂',cost:{scrap:22,alloy:3},w:3,h:2,time:22,power:-1,description:'Warm beds for three colonists. Your first permanent home.',unlock:true},garden:{name:'Grow Beds',icon:'❀',cost:{scrap:14},w:3,h:2,time:17,power:0,description:'A staffed garden that produces food each day.',unlock:true},solar:{name:'Solar Array',icon:'☼',cost:{scrap:18,alloy:2},w:2,h:2,time:17,power:8,description:'Reliable daytime power. Reduced output at night.',unlock:true},workshop:{name:'Workshop',icon:'⚒',cost:{scrap:26,alloy:5},w:3,h:2,time:26,power:-3,description:'Processes scrap into alloys when an engineer works here.',unlock:true},path:{name:'Stone Path',icon:'▦',cost:{scrap:1},w:1,h:1,time:3,power:0,description:'An easy route for your colonists.',unlock:true},clinic:{name:'Field Clinic',icon:'✚',cost:{scrap:26,alloy:5},w:3,h:2,time:24,power:-2,description:'A safer place to treat injuries and illness.',unlock:false,tech:'medicine'},comms:{name:'Signal Beacon',icon:'⌁',cost:{scrap:36,alloy:10},w:2,h:2,time:30,power:-4,description:'Establish long-range contact beyond the colony.',unlock:false,tech:'signal'},battery:{name:'Power Bank',icon:'▤',cost:{scrap:20,alloy:4},w:2,h:2,time:17,power:0,description:'Additional electrical reserve. Foundation for later grids.',unlock:false,tech:'energy'}};
const TECHS={growth:{name:'Frontier Cultivation',icon:'🌱',cost:14,description:'Better crop yields and reliable starter agriculture.',requires:null},energy:{name:'Grid Storage',icon:'⚡',cost:18,description:'Unlocks battery construction.',requires:null},medicine:{name:'Emergency Medicine',icon:'✚',cost:18,description:'Unlocks the Field Clinic.',requires:null},signal:{name:'Long-range Comms',icon:'⌁',cost:27,description:'Unlocks the Signal Beacon.',requires:'energy'}};
const NAV=[['build','▦','Build'],['crew','♟','Crew'],['colony','⌂','Colony'],['research','✦','Research'],['world','◈','World']];
const SITES=['The Glass Spire','Hollow Signal','The Quiet Array','The Old Observatory','The Singing Rocks'];
let S=null,terrain=[],features=[],fog=[],drawFeatures=[],camera={x:0,y:0,z:1},selectedType=null,preview=null,selectedColonist=null,selectedBuilding=null,tab='build',collapsed=false,last=0,renderAccum=0,uiAccum=0,saveAccum=0,noticeTimer=0,weatherTime=0,paused=false,speed=1,touchMoved=false,drag=null,pointers=new Map(),pinch=null,uid=1;
function hashStr(s){let n=2166136261;for(let i=0;i<s.length;i++){n^=s.charCodeAt(i);n=Math.imul(n,16777619)}return n>>>0}
function hash(x,y,s=0){let n=Math.imul(x+12457,374761393)^Math.imul(y+92821,668265263)^Math.imul(s+2347,1442695041);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295}
function rng(seed){let x=seed>>>0;return()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}}
function valueNoise(x,y,scale,seed){const ix=Math.floor(x/scale),iy=Math.floor(y/scale),fx=x/scale-ix,fy=y/scale-iy;const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return (hash(ix,iy,seed)*(1-u)+hash(ix+1,iy,seed)*u)*(1-v)+(hash(ix,iy+1,seed)*(1-u)+hash(ix+1,iy+1,seed)*u)*v}
function index(x,y){return y*VW+x}function inMap(x,y){return x>=0&&y>=0&&x<VW&&y<VH}
function makeMap(seed){const sd=hashStr(seed);terrain=[];features=[];fog=new Array(VW*VH).fill(false);const r=rng(sd);for(let y=0;y<VH;y++){for(let x=0;x<VW;x++){let elevation=.53*valueNoise(x,y,18,sd)+.31*valueNoise(x,y,8,sd+14)+.16*valueNoise(x,y,3,sd+71);let shore=elevation<.38?'water':elevation<.41?'sand':elevation>.69?'stone':'grass';let dist=Math.hypot(x-28,y-28);if(dist<6.5)shore='grass';let moisture=valueNoise(x,y,13,sd+44),variation=hash(x,y,sd),kind=shore;terrain.push({kind,variation,moisture,elevation});if(dist>8&&shore==='grass'&&moisture>.50&&variation>.59)features.push({x,y,type:'tree',id:'f'+x+'-'+y});else if(dist>8&&shore!=='water'&&variation<.062)features.push({x,y,type:shore==='stone'?'ore':'scrap',id:'f'+x+'-'+y});else if(dist>8&&shore==='grass'&&variation>.38&&variation<.40)features.push({x,y,type:'bush',id:'f'+x+'-'+y});}}
 const empties=[];for(let y=4;y<VH-4;y++)for(let x=4;x<VW-4;x++)if(Math.hypot(x-28,y-28)>16&&terrain[index(x,y)].kind!=='water')empties.push({x,y});if(empties.length){const spot=empties[Math.floor(r()*empties.length)];S.ruin={...spot,name:SITES[Math.floor(r()*SITES.length)],seen:false};}
 reveal(28,28,11);
}
function reveal(cx,cy,r){for(let y=Math.max(0,Math.floor(cy-r));y<Math.min(VH,cy+r+1);y++)for(let x=Math.max(0,Math.floor(cx-r));x<Math.min(VW,cx+r+1);x++)if((x-cx)**2+(y-cy)**2<r*r)fog[index(x,y)]=true;if(S?.ruin&&!S.ruin.seen&&fog[index(S.ruin.x,S.ruin.y)]){S.ruin.seen=true;log('✧','Survey team located '+S.ruin.name+'.');S.resources.knowledge+=5;}}
function initial(seed){S={v:3,seed,day:1,minute:7*60+20,resources:{scrap:140,alloy:16,food:75,knowledge:0},colonists:[],buildings:[],events:[],research:[],harvested:[],goal:0,ruin:null,weather:'clear',weatherClock:0,explore:0};makeMap(seed);uid=1;S.buildings.push({id:uid++,type:'lander',x:26,y:26,w:3,h:3,progress:100,finished:true});S.buildings.push({id:uid++,type:'supplies',x:30,y:26,w:2,h:2,progress:100,finished:true});S.buildings.push({id:uid++,type:'camp',x:26,y:30,w:3,h:2,progress:100,finished:true});for(let i=0;i<5;i++){let p=PROFILES[i];S.colonists.push({id:i+1,name:p.name,role:p.role,trait:p.trait,ambition:p.ambition,coat:p.coat,hue:p.hue,hair:p.hair,x:25.4+i*1.3,y:29.5+(i%2)*.7,energy:85+Math.random()*10,hunger:12+Math.random()*10,mood:82,social:75,skill:2+i%3,work:'auto',task:null,path:[],next:0,action:0,level:0,home:null});}uid=7;log('✦','Expedition Signal One made planetfall. Five specialists ready.');log('⌂','Establish a permanent home, then secure food production.');camera.x=28*TS;camera.y=28*TS;camera.z=1;selectedType=null;preview=null;selectedColonist=null;selectedBuilding=null;tab='build';paused=false;speed=1;renderUI(true);save();}
function log(icon,message){if(!S)return;S.events.unshift({icon,message,day:S.day,time:timeString()});if(S.events.length>50)S.events.length=50;if(S.events.length>2)notice(message);}
function timeString(){let n=Math.floor(S.minute)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function notice(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function save(){if(!S)return;try{const clean={...S,colonists:S.colonists.map(p=>({...p,path:[],task:null,action:0})),fog:fog.map(x=>x?1:0),uid};localStorage.setItem(SAVE,JSON.stringify(clean));}catch(e){console.warn('Save failed',e)}}
function load(){try{const raw=localStorage.getItem(SAVE);if(!raw)return false;const o=JSON.parse(raw);if(o.v!==3||!o.colonists||!o.buildings)return false;S=o;const oldRuin=o.ruin;makeMap(S.seed);if(oldRuin)S.ruin=oldRuin;S.harvested=S.harvested||[];features=features.filter(f=>!S.harvested.includes(f.id));fog=o.fog?.map(Boolean)||fog;uid=o.uid||Math.max(...S.buildings.map(x=>x.id))+1;for(const p of S.colonists){p.path=[];p.task=null;p.action=0;p.next=0;p.work=p.work||'auto';}if(S.ruin?.seen)S.ruin.seen=true;camera={x:28*TS,y:28*TS,z:1};return true}catch(e){console.warn(e);return false}}
function buildingAt(x,y,includeBlueprint=true){return S.buildings.find(b=>(includeBlueprint||b.finished)&&x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h)}

function clearFootprint(x,y,w,h){if(!inMap(x,y)||!inMap(x+w-1,y+h-1))return false;for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++){let xx=x+dx,yy=y+dy;if(terrain[index(xx,yy)].kind==='water'||terrain[index(xx,yy)].kind==='stone'||buildingAt(xx,yy)||featureAt(xx,yy))return false;}return true}
function canAfford(type){const t=TYPES[type];return Object.entries(t.cost).every(([r,n])=>S.resources[r]>=n)}
function accessible(type){const t=TYPES[type];return t.unlock||S.research.includes(t.tech)}
function buildAt(type,x,y){const t=TYPES[type];if(!t)return false;if(!accessible(type)){notice('Research this blueprint first.');return false}if(!clearFootprint(x,y,t.w,t.h)){notice('Find an open patch of clear ground.');return false}if(!canAfford(type)){notice('Not enough supplies for this blueprint.');return false}for(const [r,v] of Object.entries(t.cost))S.resources[r]-=v;const b={id:uid++,type,x,y,w:t.w,h:t.h,progress:0,finished:false};S.buildings.push(b);log('⚒','Blueprint placed: '+t.name+'. Builders are on the way.');selectedBuilding=b.id;preview=null;selectedType=null;renderUI(true);save();return true}
function jobs(){return S.buildings.filter(b=>!b.finished)}function finished(t){return S.buildings.filter(b=>b.finished&&b.type===t)}

function neighborGoals(x,y,w=1,h=1){const goals=[];for(let yy=y-1;yy<=y+h;yy++)for(let xx=x-1;xx<=x+w;xx++)if((xx===x-1||xx===x+w||yy===y-1||yy===y+h)&&walkable(xx,yy))goals.push({x:xx,y:yy});return goals}
function findPath(px,py,goals){const sx=clamp(Math.floor(px),0,VW-1),sy=clamp(Math.floor(py),0,VH-1);if(!goals.length)return[];const target=new Set(goals.map(g=>index(g.x,g.y))),start=index(sx,sy);if(target.has(start))return[];const prev=new Int32Array(VW*VH).fill(-1),queue=new Int32Array(VW*VH);let front=0,back=0;queue[back++]=start;prev[start]=start;let end=-1;while(front<back){const p=queue[front++],x=p%VW,y=(p-x)/VW;const cells=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];for(const [nx,ny] of cells){if(!walkable(nx,ny))continue;let j=index(nx,ny);if(prev[j]!==-1)continue;prev[j]=p;if(target.has(j)){end=j;front=back;break}queue[back++]=j}}
if(end<0)return[];const result=[];for(let i=end;i!==start;i=prev[i])result.push({x:i%VW+.5,y:Math.floor(i/VW)+.5});return result.reverse()}
function setTask(p,t){if(!t){p.task=null;p.path=[];return}const g=neighborGoals(t.x,t.y,t.w||1,t.h||1);if(t.type==='survey')g.push({x:t.x,y:t.y});const path=findPath(p.x,p.y,g);if(!path.length&&!g.some(a=>Math.hypot(a.x+.5-p.x,a.y+.5-p.y)<1.55))return false;p.task=t;p.path=path;p.action=0;return true}
function nearFeature(type,p){const pool=features.filter(f=>f.type===type&&fog[index(f.x,f.y)]);pool.sort((a,b)=>(Math.abs(a.x-p.x)+Math.abs(a.y-p.y))-(Math.abs(b.x-p.x)+Math.abs(b.y-p.y)));return pool.slice(0,7)}
function getTarget(p){const hr=S.minute/60,night=hr>=21||hr<6;let home=S.buildings.find(b=>b.id===p.home&&b.finished)||finished('shelter')[p.id%Math.max(1,finished('shelter').length)]||finished('camp')[0];if(p.energy<30||night){return{type:'rest',x:home.x,y:home.y,w:home.w,h:home.h,id:home.id}}

}
function doTask(p,dt){const t=p.task;if(!t)return;const work=dt*speed;if(p.path.length){let dst=p.path[0],dx=dst.x-p.x,dy=dst.y-p.y,d=Math.hypot(dx,dy),step=dt*speed*(p.role==='Surveyor'?2:1.65);if(d<=step){p.x=dst.x;p.y=dst.y;p.path.shift()}else{p.x+=dx/d*step;p.y+=dy/d*step}p.level=0;return}

 if(t.type==='build'){const b=S.buildings.find(b=>b.id===t.id);if(!b||b.finished){p.task=null;return}b.progress+=work*(p.role==='Engineer'?1.8:1.1)*2.2;if(b.progress>=TYPES[b.type].time){b.finished=true;b.progress=100;log('⌂',TYPES[b.type].name+' constructed by '+p.name+'.');p.task=null;updateGoal();save();}}

 else if(t.type==='rest'&&p.action>1){p.energy=clamp(p.energy+work*4.7,0,100);p.hunger=clamp(p.hunger+work*.1,0,100);if(p.energy>85&&S.minute>=6*60&&S.minute<20*60){p.task=null;}}

 else if(t.type==='research'&&p.action>7.5){p.action=0;S.resources.knowledge+=p.role==='Medic'?2:1;p.mood=clamp(p.mood+.2,0,100);}

}

$('inspector').addEventListener('click',e=>{const b=e.target.closest('[data-inspect]');if(!b)return;switch(b.dataset.inspect){case 'place':if(selectedType&&preview)buildAt(selectedType,preview.x,preview.y);break;case 'nudge':if(preview&&selectedType){let [dx,dy]=b.dataset.dir.split(',').map(Number);preview.x=clamp(preview.x+dx,0,VW-TYPES[selectedType].w);preview.y=clamp(preview.y+dy,0,VH-TYPES[selectedType].h);paintHUD();}break;case 'profile':if(selectedColonist)profile(selectedColonist);break;case 'cancel':preview=null;selectedType=null;selectedColonist=null;selectedBuilding=null;renderUI(true);break;}});

$('sheet').addEventListener('click',e=>{const b=e.target.closest('[data-sheet]');if(!b)return;const action=b.dataset.sheet;if(action==='close'){closeSheet()}else if(action==='save'){save();closeSheet();notice('Expedition saved.')}else if(action==='center'){centerCamera();closeSheet()}else if(action==='work'){const p=S.colonists.find(z=>z.id===+b.dataset.id);if(p){p.work=b.dataset.work;p.task=null;p.path=[];profile(p.id);save();}}else if(action==='follow'){const p=S.colonists.find(z=>z.id===+b.dataset.id);if(p){camera.x=p.x*TS;camera.y=p.y*TS;selectedColonist=p.id;}closeSheet()}else if(action==='newconfirm'){const field=$('seedfield');const seed=(field?.value?.trim()||'FW-10402').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,24)||'FW-10402';showSheet('<div class="smallcaps">NEW EXPEDITION</div><h2>Leave the current world?</h2><p>Generating a new planet replaces your Alpha 0.3 save on this device. Your original FARWAKE legacy save is unaffected.</p><div class="buttongroup"><button class="secondary" data-sheet="close">Keep current colony</button><button class="primary" data-sheet="new" data-seed="'+seed.replace(/["<>]/g,'')+'">Begin New World</button></div>')}else if(action==='new'){const seed=b.dataset.seed;closeSheet();initial(seed);notice('New frontier generated: '+seed)}});
$('pause').addEventListener('click',()=>{paused=!paused;paintHUD();notice(paused?'Simulation paused':'Simulation resumed')});
$('speed').addEventListener('click',()=>{speed=speed===1?2:speed===2?3:1;paintHUD();});
$('menu').addEventListener('click',openMenu);
$('zoomin').addEventListener('click',()=>setZoom(camera.z*1.2));
$('zoomout').addEventListener('click',()=>setZoom(camera.z/1.2));
$('homecam').addEventListener('click',()=>{centerCamera();selectedColonist=null;selectedBuilding=null;paintHUD()});
$('fold').addEventListener('click',()=>{collapsed=!collapsed;$('panel').classList.toggle('collapsed',collapsed);$('fold').textContent=collapsed?'⌃':'⌄';resize()});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch{}const r=canvas.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top,sx:e.clientX,sy:e.clientY};pointers.set(e.pointerId,p);if(pointers.size===1){drag={id:e.pointerId,x:p.x,y:p.y,originX:e.clientX,originY:e.clientY,moved:false};pinch=null;}else if(pointers.size===2){const pts=[...pointers.values()],mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};pinch={initial:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),zoom:camera.z,anchor:screenToWorld(mid.x,mid.y)};drag=null;}},{passive:false});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();const r=canvas.getBoundingClientRect(),p=pointers.get(e.pointerId),x=e.clientX-r.left,y=e.clientY-r.top,dx=x-p.x,dy=y-p.y;p.x=x;p.y=y;if(pinch&&pointers.size>=2){const pts=[...pointers.values()],midx=(pts[0].x+pts[1].x)/2,midy=(pts[0].y+pts[1].y)/2,dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);camera.z=clamp(pinch.zoom*dist/Math.max(1,pinch.initial),.6,2.35);camera.x=pinch.anchor.x*TS-(midx-cw/2)/camera.z;camera.y=pinch.anchor.y*TS-(midy-ch/2)/camera.z;return}
 if(drag&&drag.id===e.pointerId){if(Math.hypot(e.clientX-drag.originX,e.clientY-drag.originY)>7)drag.moved=true;if(drag.moved){camera.x-=dx/camera.z;camera.y-=dy/camera.z;camera.x=clamp(camera.x,-100,VW*TS+100);camera.y=clamp(camera.y,-100,VH*TS+100)}}},{passive:false});
function pointerEnd(e){if(!pointers.has(e.pointerId))return;const wasTap=drag&&drag.id===e.pointerId&&!drag.moved&&!pinch;pointers.delete(e.pointerId);if(wasTap&&e.type!=='pointercancel')selectTap(e.clientX,e.clientY);if(pointers.size<2)pinch=null;if(pointers.size===0)drag=null;}
canvas.addEventListener('pointerup',pointerEnd);canvas.addEventListener('pointercancel',pointerEnd);canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();setZoom(camera.z*(e.deltaY>0?.91:1.1),e.clientX-r.left,e.clientY-r.top)},{passive:false});
const obs=new ResizeObserver(resize);obs.observe($('mapwrap'));window.addEventListener('resize',resize);
function frame(now){const dt=Math.min(.07,(now-last)/1000||0);last=now;renderAccum+=dt;uiAccum+=dt;saveAccum+=dt;tick(dt);if(renderAccum>.028){draw(now);renderAccum=0}if(uiAccum>.8){paintHUD();if(tab!=='build'&&!$('sheetbg').classList.contains('open'))renderUI();uiAccum=0}if(saveAccum>12){save();saveAccum=0}requestAnimationFrame(frame)}
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();last=performance.now()});
// Surface a small test API for deterministic headless input tests; not shown in the UI.
window.FARWAKE_TEST={get state(){return S},get camera(){return camera},get terrain(){return terrain},get preview(){return preview},get tab(){return tab},screenToWorld,clearFootprint,buildAt,selectTap,save,renderUI,draw,setZoom,centerCamera,tick};
if(!load())initial('FW-10402');else{log('✦','Expedition resumed. Welcome back, Commander.');renderUI(true)}resize();requestAnimationFrame(frame);
})();
</script>
