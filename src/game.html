const SITES=['The Glass Spire','Hollow Signal','The Quiet Array','The Old Observatory','The Singing Rocks'];
let S=null,terrain=[],features=[],fog=[],drawFeatures=[],camera={x:0,y:0,z:1},selectedType=null,preview=null,selectedColonist=null,selectedBuilding=null,selectedFeature=null,selectedTerrain=null,selectedPile=null,tab='build',collapsed=true,last=0,renderAccum=0,uiAccum=0,saveAccum=0,noticeTimer=0,weatherTime=0,paused=false,speed=1,touchMoved=false,drag=null,pointers=new Map(),pinch=null,uid=1;
function hashStr(s){let n=2166136261;for(let i=0;i<s.length;i++){n^=s.charCodeAt(i);n=Math.imul(n,16777619)}return n>>>0}
function hash(x,y,s=0){let n=Math.imul(x+12457,374761393)^Math.imul(y+92821,668265263)^Math.imul(s+2347,1442695041);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295}
function rng(seed){let x=seed>>>0;return()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}}
function valueNoise(x,y,scale,seed){const ix=Math.floor(x/scale),iy=Math.floor(y/scale),fx=x/scale-ix,fy=y/scale-iy;const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return (hash(ix,iy,seed)*(1-u)+hash(ix+1,iy,seed)*u)*(1-v)+(hash(ix,iy+1,seed)*(1-u)+hash(ix+1,iy+1,seed)*u)*v}
function index(x,y){return y*VW+x}function inMap(x,y){return x>=0&&y>=0&&x<VW&&y<VH}
function makeMap(seed){const sd=hashStr(seed);terrain=[];features=[];fog=new Array(VW*VH).fill(false);const r=rng(sd);for(let y=0;y<VH;y++){for(let x=0;x<VW;x++){let elevation=.53*valueNoise(x,y,18,sd)+.31*valueNoise(x,y,8,sd+14)+.16*valueNoise(x,y,3,sd+71);let shore=elevation<.38?'water':elevation<.41?'sand':elevation>.69?'stone':'grass';let dist=Math.hypot(x-28,y-28);if(dist<6.5)shore='grass';let moisture=valueNoise(x,y,13,sd+44),variation=hash(x,y,sd),kind=shore;terrain.push({kind,variation,moisture,elevation});if(dist>8&&shore==='grass'&&moisture>.50&&variation>.59)features.push({x,y,type:'tree',id:'f'+x+'-'+y});else if(dist>8&&shore!=='water'&&variation<.062)features.push({x,y,type:shore==='stone'?'ore':'scrap',id:'f'+x+'-'+y});else if(dist>8&&shore==='grass'&&variation>.38&&variation<.40)features.push({x,y,type:'bush',id:'f'+x+'-'+y});}}
 const empties=[];for(let y=4;y<VH-4;y++)for(let x=4;x<VW-4;x++)if(Math.hypot(x-28,y-28)>16&&terrain[index(x,y)].kind!=='water')empties.push({x,y});if(empties.length){const spot=empties[Math.floor(r()*empties.length)];S.ruin={...spot,name:SITES[Math.floor(r()*SITES.length)],seen:false};}
 reveal(28,28,11);
}

}

function reveal(cx,cy,r){for(let y=Math.max(0,Math.floor(cy-r));y<Math.min(VH,cy+r+1);y++)for(let x=Math.max(0,Math.floor(cx-r));x<Math.min(VW,cx+r+1);x++)if((x-cx)**2+(y-cy)**2<r*r)fog[index(x,y)]=true;if(S?.ruin&&!S.ruin.seen&&fog[index(S.ruin.x,S.ruin.y)]){S.ruin.seen=true;log('✧','Survey team located '+S.ruin.name+'.');S.resources.knowledge+=5;}}
function initial(seed){const founderRandom=rng(hashStr(seed)^0x46574b);editor=null;FarwakeWorkFX.reset();S={v:4,seed,day:1,minute:7*60+20,resources:{scrap:125,wood:42,ore:0,alloy:16,food:75,knowledge:0},colonists:[],buildings:[],events:[],research:[],harvested:[],piles:[],designations:{},goal:0,ruin:null,weather:'clear',weatherClock:0,explore:0};makeMap(seed);guaranteeStartingOre();uid=1;S.buildings.push({id:uid++,type:'lander',x:26,y:26,w:3,h:3,progress:100,finished:true});S.buildings.push({id:uid++,type:'supplies',x:30,y:26,w:2,h:2,progress:100,finished:true});S.buildings.push({id:uid++,type:'camp',x:26,y:30,w:3,h:2,progress:100,finished:true});for(let i=0;i<5;i++){let p=PROFILES[i];S.colonists.push({id:i+1,name:p.name,role:p.role,trait:p.trait,ambition:p.ambition,coat:p.coat,hue:p.hue,hair:p.hair,x:25.4+i*1.3,y:29.5+(i%2)*.7,energy:85+founderRandom()*10,hunger:12+founderRandom()*10,mood:82,social:75,skill:2+i%3,work:'auto',task:null,path:[],next:0,action:0,level:0,home:null});}uid=7;frontierMigrate();freightInit();housingAllocate();log('✦','Expedition Signal One made planetfall. Five specialists ready.');log('⌂','Establish a permanent home, then secure food production.');camera.x=28*TS;camera.y=28*TS;camera.z=1;selectedType=null;preview=null;selectedColonist=null;selectedBuilding=null;selectedFeature=null;selectedTerrain=null;selectedPile=null;tab='build';paused=false;speed=1;renderUI(true);save();}

function classifyStoredSave(raw){
 if(raw==null)return {state:'missing',raw};
 let stored;try{stored=JSON.parse(raw)}catch(e){return {state:'corrupt',raw}}
 if(!stored||typeof stored!=='object'||Array.isArray(stored))return {state:'corrupt',raw};
 if(Number.isFinite(stored.v)&&stored.v>SAVE_VERSION)return {state:'newer',raw,stored};
 const writer=localStorage.getItem(SAVE_WRITER);
 if(writer&&writer!==loadedStamp&&writer!==lastWrittenStamp)return {state:'foreign',raw,stored};
 return {state:'ok',raw,stored};
}
function refuseStoredSave(found){
 saveLocked=true;paused=true;
 const storedVersion=found.stored&&Number.isFinite(found.stored.v)?found.stored.v:'unreadable';
 const message=found.state==='corrupt'
  ?'The stored expedition could not be read. This page left that save unchanged and will not replace it.'
  :found.state==='foreign'
  ?'Another build already updated this expedition. This page left that save unchanged and will not replace or downgrade it.'
  :'A newer expedition is already stored on this device (version '+storedVersion+'). This build is version '+SAVE_VERSION+' and did not replace, delete, or downgrade that save.';
 try{notice(message)}catch(e){}
 try{
  showSheet(sectionHeader(found.state==='corrupt'?'Expedition needs recovery':'Newer expedition','SAVE PROTECTION')+'<p>'+esc(message)+'</p><p>Close this page and open the current build if the stored expedition is from a newer version. Nothing stored was removed.</p><button class="primary" id="download-newer-save">Download stored save</button>');
  const button=$('download-newer-save');
  if(button)button.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([found.raw],{type:'application/json'}));a.download='FARWAKE-newer-expedition.json';a.click()};
 }catch(e){}
}

 if(found.state!=='ok'&&found.state!=='missing'){refuseStoredSave(found);return}
 const clean={...S,colonists:S.colonists.map(p=>({...p,path:[],task:null,action:0,indoorStay:FarwakeDoors.saveVisit(p)})),fog:fog.map(x=>x?1:0),uid};
 localStorage.setItem(SAVE,JSON.stringify(clean));

function validExpeditionSave(o){
 if(!o||typeof o!=='object'||Array.isArray(o)||![3,4].includes(o.v)||typeof o.seed!=='string'||o.seed.length<1||o.seed.length>100)return false;
 if(!Number.isFinite(o.day)||o.day<1||!Number.isFinite(o.minute)||o.minute<0||o.minute>=1440)return false;
 if(!o.resources||typeof o.resources!=='object'||!Array.isArray(o.colonists)||!Array.isArray(o.buildings)||!Array.isArray(o.fog))return false;
 if(o.v===4&&!FarwakeSaveMigration.validLife(o))return false;
 if(o.fog.length!==VW*VH||o.colonists.length<1||o.colonists.length>100||o.buildings.length>10000)return false;
 if(!o.colonists.every(p=>p&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&typeof p.name==='string'))return false;
 if(!o.buildings.every(b=>b&&Number.isFinite(b.x)&&Number.isFinite(b.y)&&typeof b.type==='string'&&Number.isFinite(b.w)&&Number.isFinite(b.h)))return false;
 return true;
}
function exportExpedition(){
 save();
 const raw=localStorage.getItem(SAVE);
 if(!raw){notice('No expedition save to export.');return;}
 try{
  const data=JSON.parse(raw);
  if(!validExpeditionSave(data))throw Error('Save data is invalid.');
  const backup={format:'farwake-expedition-backup',formatVersion:1,exportedAt:new Date().toISOString(),save:data};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='FARWAKE-'+String(data.seed||'expedition').replace(/[^a-z0-9_-]/gi,'_').slice(0,30)+'-day-'+data.day+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  notice('Expedition backup prepared. Save it in Files.');
 }catch(e){console.error('Export failed',e);notice('Could not export the expedition.');}
}
async function importExpeditionFile(file){
 if(!file)return;
 try{
  if(file.size>5*1024*1024)throw Error('Backup file is too large.');
  const loaded=JSON.parse(await file.text());
  const data=loaded?.format==='farwake-expedition-backup'?loaded.save:loaded;
  if(!validExpeditionSave(data))throw Error('This is not a compatible FARWAKE Founders save (versions 3–4).');
  const current=localStorage.getItem(SAVE);
  if(!confirm('Import '+data.seed+' (Day '+data.day+')? This replaces the colony stored at this web address. A local emergency backup will be kept.'))return;
  if(current)localStorage.setItem(SAVE+'_before_import_'+Date.now(),current);
  localStorage.setItem(SAVE,JSON.stringify(data));
  importedNavigation=true;location.reload();
 }catch(e){console.warn('Import failed',e);notice(e.message||'Could not import this file.');}
}
