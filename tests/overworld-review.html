<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#17232c;color:white;font:14px sans-serif}iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0}aside{margin-left:410px;padding:15px}button{display:block;margin:12px 0;padding:14px}</style><iframe id="game" src="../index.html?review=1"></iframe><aside><h2>Lamplight Lane — real colony review</h2><button id="bench">Measure 40 paused world draws</button><button id="load">Import historical Day 58</button><button id="frame">Frame Aya home</button><button id="evening">Seek genuine occupied evening</button><button id="sample">Sample 15 seconds of ordinary play</button><button id="day">Seek daylight</button><pre id="status"></pre></aside><script>
const frame=document.querySelector('iframe'),status=document.querySelector('#status');
load.onclick=async()=>{const w=frame.contentWindow,d=w.document;if(!w.FARWAKE_TEST)return;const file=await fetch('fixtures/home-composition-day58.json').then(r=>r.text());w.confirm=()=>true;d.querySelector('[data-field-open=operations]').click();setTimeout(()=>{const input=d.querySelector('#import-expedition-file');const transfer=new w.DataTransfer();transfer.items.add(new w.File([file],'day58-review.json',{type:'application/json'}));input.files=transfer.files;input.dispatchEvent(new w.Event('change',{bubbles:true}));},100);};
function g(){return frame.contentWindow.FARWAKE_TEST}function pause(){const d=frame.contentDocument,b=d.querySelector('#pause');if(b.getAttribute('aria-label')==='Pause simulation')b.click();}
function focusHome(){const a=g(),p=a.state.colonists.find(p=>p.name==='Aya Mercer'),b=a.state.buildings.find(b=>b.id===p.home);Object.assign(a.camera,{x:(b.x+b.w/2)*32,y:(b.y+b.h/2+1)*32,z:2});status.textContent=JSON.stringify({day:a.state.day,minute:a.state.minute,home:b.id,door:frame.contentWindow.FarwakeDoors.state(b),grid:a.surveyGrid()},null,2);a.draw(performance.now());}
document.querySelector('#frame').onclick=()=>{pause();focusHome()};
evening.onclick=()=>{const pb=frame.contentDocument.querySelector('#pause');if(pb.getAttribute('aria-label')==='Resume simulation')pb.click();const a=g(),w=frame.contentWindow;for(let i=0;i<180000;i++){a.tick(.025);const p=a.state.colonists[0],b=a.state.buildings.find(b=>b.id===p.home);if(a.state.minute>1150&&a.state.minute<1270&&w.FarwakeDoors.state(b).occupied>0&&a.surveyGrid().supply>=a.surveyGrid().used)break;}pause();a.advanceWorld(.001);focusHome()};
day.onclick=()=>{const pb=frame.contentDocument.querySelector('#pause');if(pb.getAttribute('aria-label')==='Resume simulation')pb.click();const a=g();for(let i=0;i<160000;i++){a.tick(.025);if(a.state.minute>700&&a.state.minute<705)break;}pause();a.advanceWorld(.001);focusHome()};

sample.onclick=()=>{const a=g(),w=frame.contentWindow,pb=frame.contentDocument.querySelector('#pause');if(pb.getAttribute('aria-label')==='Resume simulation')pb.click();let prev=performance.now(),start=prev,frames=[];function record(now){frames.push(now-prev);prev=now;if(now-start<15000){requestAnimationFrame(record);return}pause();frames.sort((a,b)=>a-b);status.textContent=JSON.stringify({elapsed:now-start,frames:frames.length,p50:frames[Math.floor(frames.length*.5)],p95:frames[Math.floor(frames.length*.95)],max:frames.at(-1),pilot:w.FarwakeLamplight.diagnostics(),people:a.state.colonists.length},null,2)}requestAnimationFrame(record)};
bench.onclick=()=>{pause();focusHome();const a=g(),out=[];for(let i=0;i<40;i++){const t=performance.now();a.draw(t);out.push(performance.now()-t)}out.sort((a,b)=>a-b);status.textContent=JSON.stringify({source:frame.getAttribute('src'),draws:40,median:out[20],p95:out[38],max:out[39],people:a.state.colonists.length,minute:a.state.minute},null,2)};
</script>
