<!doctype html><meta charset="utf-8"><title>FARWAKE · Local release review</title>
<style>body{margin:0;background:#111913;color:#ddd8c6;font:14px system-ui}aside{width:280px;padding:20px}button,select{display:block;width:100%;padding:12px;margin:8px 0;background:#263528;color:#e2d9be;border:1px solid #687355;border-radius:4px}iframe{position:fixed;right:0;top:0;border:0}p{font-size:12px;line-height:1.6;color:#aab59d}</style>
<aside><h1>FARWAKE</h1><p>Internal review only. Isolated browser saves. No deployment.</p><label>Version<select id="version"><option value="candidate">Beyond the Frontier</option><option value="foundations">Foundations baseline</option></select></label><label>Phone viewport<select id="viewport"><option>390×844</option><option>375×667</option><option>430×932</option><option>844×390</option></select></label><button data-screen="build">Construction catalogue</button><button data-screen="research">Technology tree</button><button data-screen="colony">Command Center</button><button data-screen="world">Planetary discoveries</button><button data-screen="map">Settlement</button><button id="organic">Load organically developed colony</button><button id="hour">Advance one colony hour</button><p id="status">Loading</p></aside><iframe width="390" height="844"></iframe>
<script>
const frame=document.querySelector('iframe'),status=document.querySelector('#status');let screen='build',clock=1000;
function show(){const w=frame.contentWindow,g=w.FARWAKE_TEST;if(!g)return;if(screen==='map')w.document.querySelector('[data-sheet="close"]')?.click();else w.QA.openSection(screen);g.advanceWorld(.1);g.draw(clock);status.textContent='Day '+g.state.day+' · '+g.state.colonists.length+' residents · '+frame.width+'×'+frame.height;}
function open(){frame.onload=show;frame.src=version.value+'/index.html?slot=review-'+version.value;}
viewport.onchange=()=>{const [width,height]=viewport.value.split('×');frame.width=width;frame.height=height;setTimeout(show,50)};
version.onchange=open;
document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{screen=b.dataset.screen;show()});
organic.onclick=()=>{if(version.value!=='candidate'){status.textContent='Select Beyond to review its expanded colony.';return}const raw=localStorage.getItem('frontier-organic-review');if(!raw){status.textContent='Run frontier-fresh.html first.';return}frame.contentWindow.localStorage.setItem('farwake_qa_review-candidate',raw);frame.contentWindow.FARWAKE_TEST.load();frame.contentWindow.FARWAKE_TEST.renderUI();show()};
hour.onclick=()=>{const g=frame.contentWindow.FARWAKE_TEST;for(let i=0;i<194;i++){g.tick(.1);g.advanceWorld(.1);clock+=100}show()};open();
</script>
