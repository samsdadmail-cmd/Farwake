<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FARWAKE experience review</title><style>body{margin:0;background:#10202b;color:#ecdabe;font:12px system-ui;display:flex;gap:16px;padding:12px}aside{width:250px;flex-shrink:0}button,select{background:#213943;color:#ecdabe;border:1px solid #698882;padding:12px;margin:3px;min-height:44px}iframe{width:390px;height:844px;border:1px solid #698882;flex-shrink:0}pre{white-space:pre-wrap;font:10px/1.5 monospace;max-height:500px;overflow:auto}h1{font:23px Georgia}</style><aside><h1>The Living Colony</h1><p>Isolated QA colony. Fixtures are labelled. Player save key is never used.</p><select id="viewport" aria-label="Review viewport"><option value="390,844">iPhone portrait</option><option value="844,390">iPhone landscape</option><option value="375,667">Small iPhone</option></select><button id="ordinary">Reset QA colony</button><button id="evening">Evening fixture</button><button id="step">Advance simulation 5s</button><button id="rain">Rain</button><button id="clear">Clear</button><button id="home">Camp interior</button><button id="cabin">Occupied home fixture</button><button id="five">Observe five real minutes</button><select id="population" aria-label="Population"><option>5</option><option>20</option><option>40</option></select><button id="profile">Profile 15 seconds</button><p id="status">Loading</p><pre id="out"></pre></aside><iframe id="game" src="../index.html?review=1" title="Isolated FARWAKE colony"></iframe><script>
const frame=document.querySelector('iframe'),status=document.getElementById('status'),out=document.getElementById('out'),g=()=>frame.contentWindow.FARWAKE_TEST;let observe=null,profile=null;
function report(v){out.textContent=JSON.stringify(v,null,2)+'\n'+out.textContent.slice(0,14000)}
frame.onload=()=>status.textContent='QA colony running';
document.getElementById('viewport').onchange=e=>{let [w,h]=e.target.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px'};
document.getElementById('ordinary').onclick=()=>{frame.addEventListener('load',()=>{for(const k of ['farwake_overhaul_review_v4','farwake_overhaul_review_v4_writer'])localStorage.removeItem(k);frame.src='../index.html?review=1&reload='+Date.now()},{once:true});frame.src='about:blank'};
document.getElementById('evening').onclick=()=>{const q=g(),s=q.state;s.minute=1093;s.weather='clear';for(const k of Object.keys(q.industryPolicy().weights))q.industryPolicy().weights[k]=0;for(const p of s.colonists)Object.assign(p,{energy:95,hunger:5,task:null,path:[],carry:null});let garden;for(let y=27;y<38&&!garden;y++)for(let x=23;x<35&&!garden;x++)if(q.clearFootprint(x,y,3,2))garden={id:990,type:'garden',x,y,w:3,h:2,finished:true,progress:100};if(garden&&!s.buildings.some(b=>b.id===990))s.buildings.push(garden);q.centerCamera();status.textContent='FIXTURE: fed founders, idle work, garden; genuine travel and encounters'};
document.getElementById('step').onclick=()=>{const q=g();for(let i=0;i<50;i++){q.tick(.1);q.advanceWorld(.1)}q.draw(performance.now());report({minute:q.state.minute,people:q.state.colonists.map(p=>({name:p.name,task:p.task?.type,view:(v=>v&&({...v,look:v.look?.name||null}))(q.lifeView(p)),life:p.life})),sessions:q.lifeRoot().sessions})};
document.getElementById('rain').onclick=()=>g().state.weather='rain';document.getElementById('clear').onclick=()=>g().state.weather='clear';document.getElementById('cabin').onclick=()=>{const q=g(),s=q.state;let b=s.buildings.find(b=>b.id===991);if(!b){for(let y=29;y<42&&!b;y++)for(let x=19;x<37&&!b;x++)if(q.clearFootprint(x,y,3,2)&&!q.frontierPlacementReason('shelter',x,y))b={id:991,type:'shelter',x,y,w:3,h:2,finished:true,progress:100};if(!b)throw Error('No safe home site');s.buildings.push(b)}s.minute=1093;s.weather='rain';for(const p of s.colonists.slice(0,2)){q.housingAssign(p.id,b.id);Object.assign(p,{task:null,path:[],energy:95,hunger:5});q.lifePerson(p).doneDay=0;q.lifePerson(p).retryAt=0}for(let i=0;i<180;i++){q.tick(.1);q.advanceWorld(.1)}q.showBuilding(b.id);q.draw(performance.now());status.textContent='FIXTURE: reachable home; actual indoor occupancy'};
document.getElementById('home').onclick=()=>g().showBuilding(g().state.buildings.find(b=>b.type==='camp').id);
document.getElementById('five').onclick=()=>{observe={start:performance.now(),tasks:new Set(),phases:new Set(),samples:0};status.textContent='Five real minutes running'};
document.getElementById('profile').onclick=()=>{const q=g(),s=q.state,founders=s.colonists.slice(0,5),n=+document.getElementById('population').value;if(s.colonists.length!==n)s.colonists=Array.from({length:n},(_,i)=>({...founders[i%5],id:200+i,life:null,task:null,path:[],visit:null,carry:null,x:25.5+i%6,y:28.5+Math.floor(i/6)}));profile={start:performance.now(),last:performance.now(),n,intervals:[],before:q.healthSnapshot()};status.textContent='Synthetic '+n+'-person profile'};
function sample(now){if(profile){profile.intervals.push(now-profile.last);profile.last=now;if(now-profile.start>15000){const a=profile.intervals.sort((a,b)=>a-b);report({proxy:'desktop frame intervals; not iPhone',people:profile.n,samples:a.length,median:a[Math.floor(a.length*.5)],p95:a[Math.floor(a.length*.95)],max:a.at(-1),before:profile.before,after:g().healthSnapshot()});profile=null;status.textContent='Profile complete'}}requestAnimationFrame(sample)}requestAnimationFrame(sample);
setInterval(()=>{if(!g()?.state||!observe)return;const q=g(),s=q.state;observe.samples++;for(const p of s.colonists){observe.tasks.add(p.task?.type||'idle');const v=q.lifeView(p);if(v)observe.phases.add(v.kind+':'+v.phase)}const sec=(performance.now()-observe.start)/1000;status.textContent=Math.floor(sec)+' / 300 real seconds · Day '+s.day+' minute '+Math.floor(s.minute);if(sec>=300){report({realSeconds:sec,tasks:[...observe.tasks],phases:[...observe.phases],samples:observe.samples,health:q.healthSnapshot(),people:s.colonists.map(p=>({name:p.name,life:p.life}))});observe=null;status.textContent='Five real minutes complete'}},500);
</script></html>
