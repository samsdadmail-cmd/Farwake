name: CI

on:
  pull_request:
    branches: [farwake/integration, farwake/combined/rc1, main]
  push:
    branches: [farwake/integration, living-colony-experience-overhaul]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Assemble index.html and fail if it drifts
        run: |
          python3 build.py
          git diff --exit-code -- index.html
      - name: Content and survival regressions
        run: |
          node tests/frontier-content.cjs
          node tests/frontier-survival.cjs
      - name: Living Colony recovery migration
        run: node tests/life-migration.cjs
      - name: Housing regression
        run: node tests/housing.cjs
      - name: Save fixture sanity
        run: node tests/fixture-sanity.cjs
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-chromium-webkit
      - name: Install Playwright browsers
        run: npm ci && npx playwright install --with-deps chromium webkit
      - name: Headless smoke, save loads, and baseline probes
        run: npm test

      - name: Keep unattended browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unattended-browser-diagnostics
          path: test-results/
          if-no-files-found: ignore

  legacy-browser-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # prepare-foundations.py and prepare-visual-check.py read older commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-chromium
      - name: Install Playwright Chromium
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run existing verify suites
        run: npm run test:suites
      - name: Keep organic journey diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organic-journey
          path: |
            test-results/journey.log
            test-results/journey-checkpoint.json
          if-no-files-found: ignore
