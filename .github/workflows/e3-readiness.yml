name: E3 integration readiness
on:
  push:
    branches: [home-composition-checkpoint]
    paths: ['tests/headless/e3-integration-readiness.spec.mjs', '.github/workflows/e3-readiness.yml']
permissions:
  contents: read
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify retained source and save protections
        run: |
          python3 build.py --check
          node tests/frontier-content.cjs
          node tests/frontier-survival.cjs
          node tests/life-migration.cjs
          node tests/fixture-sanity.cjs
          node tests/housing.cjs
          node tests/lamplight.cjs
          node tests/world-hud.cjs
      - name: Install browsers
        run: npm ci && npx playwright install --with-deps chromium webkit
      - name: Current pinned preview and repeated callback attribution
        run: npx playwright test --config=tests/playwright.config.mjs tests/headless/e3-integration-readiness.spec.mjs
      - name: Save and gameplay regression
        if: ${{ !cancelled() }}
        run: npx playwright test --config=tests/playwright.config.mjs tests/headless/saves.spec.mjs tests/headless/smoke.spec.mjs
      - name: Existing management systems
        if: ${{ !cancelled() }}
        run: npm run test:suites -- frontier-ui command production research economy frontier-industry integration
      - name: Keep readiness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e3-integration-readiness
          path: test-results/
